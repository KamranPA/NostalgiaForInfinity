name: Diagnose OKX Pairlist Hang

# Manual trigger only — run this from the GitHub mobile app:
# Repo -> Actions tab -> "Diagnose OKX Pairlist Hang" -> Run workflow
on:
  workflow_dispatch:
    inputs:
      hang_timeout_seconds:
        description: "How long to let freqtrade run before force-killing it (seconds)"
        required: false
        default: "240"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TA-Lib system library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential wget
          wget -q https://github.com/ta-lib/ta-lib/releases/download/v0.6.4/ta-lib-0.6.4-src.tar.gz
          tar -xzf ta-lib-0.6.4-src.tar.gz
          cd ta-lib-0.6.4
          ./configure --prefix=/usr
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig

      - name: Install Freqtrade + dependencies
        run: |
          pip install --upgrade pip
          pip install freqtrade ta-lib

      - name: Build isolated debug config (fresh in-memory DB, no Telegram, no open-trades interference)
        run: |
          mkdir -p user_data
          cat > debug_config.json <<'EOF'
          {
            "trading_mode": "spot",
            "margin_mode": "",
            "max_open_trades": 8,
            "stake_currency": "USDT",
            "stake_amount": "unlimited",
            "tradable_balance_ratio": 0.99,
            "fiat_display_currency": "USD",
            "dry_run": true,
            "dry_run_wallet": 1000,
            "timeframe": "5m",
            "cancel_open_orders_on_exit": true,
            "position_adjustment_enable": true,
            "max_entry_position_adjustment": -1,
            "unfilledtimeout": { "entry": 10, "exit": 30 },
            "exchange": {
              "name": "okx",
              "key": "",
              "secret": "",
              "password": "",
              "ccxt_config": {},
              "ccxt_async_config": {},
              "pair_whitelist": [],
              "pair_blacklist": [".*(_PREMIUM|BEAR|BULL|DOWN|HALF|HEDGE|UP|[1235][SL])/.*"]
            },
            "entry_pricing": {
              "price_side": "same",
              "use_order_book": true,
              "order_book_top": 1,
              "price_last_balance": 0.0,
              "check_depth_of_market": { "enabled": false, "bids_to_ask_delta": 1 }
            },
            "exit_pricing": {
              "price_side": "same",
              "use_order_book": true,
              "order_book_top": 1
            },
            "pairlists": [
              { "method": "VolumePairList", "number_assets": 130, "sort_key": "quoteVolume", "refresh_period": 1800, "lookback_days": 1 },
              { "method": "FullTradesFilter" },
              { "method": "AgeFilter", "min_days_listed": 60 },
              { "method": "PriceFilter", "low_price_ratio": 0.003 },
              { "method": "SpreadFilter", "max_spread_ratio": 0.005 },
              { "method": "RangeStabilityFilter", "lookback_days": 3, "min_rate_of_change": 0.03, "max_rate_of_change": 0.95, "refresh_period": 1800 },
              { "method": "VolumePairList", "number_assets": 100, "sort_key": "quoteVolume", "lookback_days": 1 }
            ],
            "telegram": { "enabled": false, "token": "", "chat_id": "" },
            "db_url": "sqlite:///user_data/debug_fresh.sqlite",
            "api_server": { "enabled": false },
            "bot_name": "nfi-okx-pairlist-debug",
            "force_entry_enable": false,
            "initial_state": "running",
            "internals": { "process_throttle_secs": 30 }
          }
          EOF
          rm -f user_data/debug_fresh.sqlite

      - name: Run Freqtrade with verbose logging (auto-killed after timeout)
        run: |
          set +e
          HANG_TIMEOUT="${{ inputs.hang_timeout_seconds }}"
          echo "Running freqtrade for up to ${HANG_TIMEOUT}s with -vv, then killing it regardless of outcome..."
          timeout --signal=KILL "${HANG_TIMEOUT}s" \
            freqtrade trade \
              --config debug_config.json \
              --strategy NostalgiaForInfinityX7 \
              -vv \
              > debug_output.log 2>&1
          EXIT_CODE=$?
          echo "freqtrade exited with code: $EXIT_CODE (137/124 = killed by timeout, meaning it was still stuck/running)"
          echo "$EXIT_CODE" > exit_code.txt

      - name: Show last part of the debug log directly in the Job Summary
        if: always()
        run: |
          {
            echo "### Freqtrade debug run result"
            echo ""
            echo "Exit code: \`$(cat exit_code.txt 2>/dev/null || echo unknown)\`"
            echo ""
            echo "### Last ~300 lines of verbose output (this is where it stopped / hung):"
            echo ""
            echo '```'
            tail -n 300 debug_output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full debug log as artifact (backup, in case summary is truncated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okx-pairlist-debug-log
          path: debug_output.log
          retention-days: 7
