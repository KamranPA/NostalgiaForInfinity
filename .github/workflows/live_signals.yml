name: Telegram Live Signals

on:
  workflow_dispatch:

jobs:
  live-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies for TA-Lib
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget
          wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib/
          ./configure --prefix=/usr
          make
          sudo make install
          cd ..
          rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      - name: Install Freqtrade & Telegram Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "freqtrade[telegram]" python-telegram-bot --upgrade

      - name: Inject Secrets into Config
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          sed -i "s/TELEGRAM_TOKEN_PLACEHOLDER/$TELEGRAM_TOKEN/g" config_telegram.json
          sed -i "s/TELEGRAM_CHAT_ID_PLACEHOLDER/$TELEGRAM_CHAT_ID/g" config_telegram.json

      - name: Run Live Signal Bot
        run: |
          freqtrade trade \
            --config config_telegram.json \
            --strategy NostalgiaForInfinityX7
