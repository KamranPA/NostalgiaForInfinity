name: Telegram Live Signals

on:
  workflow_dispatch:

jobs:
  live-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies for TA-Lib
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget
          wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib/
          ./configure --prefix=/usr
          make
          sudo make install
          cd ..
          rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      - name: Install Freqtrade
        run: |
          python -m pip install --upgrade pip
          pip install freqtrade

      - name: Inject Secrets into Config
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node -e '
            const fs = require("fs");
            let conf = fs.readFileSync("config_telegram.json", "utf8");
            conf = conf.replace("TELEGRAM_TOKEN_PLACEHOLDER", process.env.TELEGRAM_TOKEN);
            conf = conf.replace("TELEGRAM_CHAT_ID_PLACEHOLDER", process.env.TELEGRAM_CHAT_ID);
            fs.writeFileSync("config_telegram.json", conf);
          '

      - name: Test Telegram Connection
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=✅ تست اتصال: ربات سیگنال‌دهی با موفقیت روی گیت‌هاب فعال شد!"

      - name: Run Dry-Run Signal Generator
        run: |
          freqtrade trade \
            --config config_telegram.json \
            --strategy NostalgiaForInfinityX7 \
            --dry-run-wallet 1000
