name: Telegram Live Signals

on:
  workflow_dispatch: # اجرای دستی روی موبایل

jobs:
  live-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Freqtrade
        run: |
          python -m pip install --upgrade pip
          pip install freqtrade

      - name: Run Live Signal Bot
        run: |
          freqtrade trade \
            --config config_telegram.json \
            --strategy NostalgiaForInfinityX7
