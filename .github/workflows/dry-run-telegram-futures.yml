# SAVE THIS FILE AS: .github/workflows/dry-run-telegram-futures.yml
# (in .github/workflows/, alongside dry-run-telegram-signals.yml)
name: NFI Futures Dry-Run Telegram Signals (OKX)

# Same architecture as dry-run-telegram-signals.yml (the spot workflow) —
# see that file's header comment for the full explanation of the
# self-queueing restart chain. Key differences here:
#   - config_dryrun_futures.json instead of config_dryrun_telegram.json
#   - FREQTRADE__DB_URL uses a dedicated Postgres ROLE (futures_bot) whose
#     search_path is preset server-side to the 'futures' schema — this
#     works regardless of pooler mode, unlike the earlier attempt to pass
#     ?options=-csearch_path=... in the connection string, which Supabase's
#     pooler silently ignored (confirmed via a live diagnostic query, not
#     assumed) even in Session pooler mode.
#   - concurrency group is separate (nfi-dryrun-futures) so this doesn't
#     interfere with the spot workflow's own restart chain
#   - reuses the SAME Telegram bot/chat as spot — messages are
#     distinguished by bot_name (nfi-dryrun-futures-okx) inside the config

on:
  workflow_dispatch: {}

concurrency:
  group: nfi-dryrun-futures
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  dryrun-futures:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Notify Telegram — futures workflow started
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN_FUTURES }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="🔄 NFI FUTURES (OKX) dry-run workflow started (run #${{ github.run_number }}). Freqtrade is now installing/starting up...")
          echo "Telegram API response: $RESPONSE"
          if ! echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "::warning::Telegram did not accept the message — check TELEGRAM_TOKEN_FUTURES/TELEGRAM_CHAT_ID secrets."
          fi

      - name: Verify required secrets are set
        run: |
          MISSING=""
          [ -z "${{ secrets.TELEGRAM_TOKEN_FUTURES }}" ] && MISSING="$MISSING TELEGRAM_TOKEN_FUTURES"
          [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ] && MISSING="$MISSING TELEGRAM_CHAT_ID"
          [ -z "${{ secrets.SUPABASE_DB_URL }}" ] && MISSING="$MISSING SUPABASE_DB_URL"
          [ -z "${{ secrets.SUPABASE_DB_URL_FUTURES }}" ] && MISSING="$MISSING SUPABASE_DB_URL_FUTURES"
          if [ -n "$MISSING" ]; then
            echo "::error::These GitHub Secrets are empty or not set:$MISSING — go to Settings > Secrets and variables > Actions and add them. SUPABASE_DB_URL is the admin connection (used only to ensure the schema exists); SUPABASE_DB_URL_FUTURES is the dedicated futures_bot role connection (used by freqtrade itself, and pre-configured server-side to default into the 'futures' schema)."
            exit 1
          fi
          echo "All required secrets are present (values not shown here for security)."

      - name: Ensure the 'futures' schema exists (one-time, idempotent)
        env:
          ADMIN_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pip install psycopg2-binary --quiet
          python3 - <<'PYEOF'
          import os, psycopg2
          conn = psycopg2.connect(os.environ["ADMIN_DB_URL"])
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute("CREATE SCHEMA IF NOT EXISTS futures;")
          conn.close()
          print("Confirmed: schema 'futures' exists (created now, or already existed).")
          PYEOF

      - name: Verify the futures_bot role actually lands in the 'futures' schema
        env:
          FUTURES_DB_URL: ${{ secrets.SUPABASE_DB_URL_FUTURES }}
        run: |
          # Connects with the SAME URL freqtrade uses below and asks Postgres
          # directly what schema is active — this checks the actual role-level
          # `ALTER ROLE futures_bot SET search_path TO futures, public;`
          # setting made in Supabase's SQL editor, rather than a client-side
          # connection-string trick (which a previous attempt showed gets
          # silently ignored by Supabase's pooler, even in Session mode).
          python3 - <<'PYEOF'
          import os, psycopg2
          conn = psycopg2.connect(os.environ["FUTURES_DB_URL"])
          with conn.cursor() as cur:
              cur.execute("SELECT current_schema(), current_setting('search_path');")
              schema, search_path = cur.fetchone()
              print(f"current_schema() = {schema}")
              print(f"search_path setting = {search_path}")
              if schema != "futures":
                  raise SystemExit(
                      "PROBLEM: futures_bot did not land in the 'futures' schema. "
                      "Re-check 'ALTER ROLE futures_bot SET search_path TO futures, public;' "
                      "was run successfully in the Supabase SQL editor."
                  )
              print("OK — futures_bot's role-level search_path is working correctly.")
          conn.close()
          PYEOF

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-nfi-futures-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-nfi-futures-

      - name: Install TA-Lib system library
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget
          wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib
          ./configure --prefix=/usr
          make
          sudo make install
          cd ..

      - name: Install Freqtrade + dependencies
        run: |
          python -m pip install --upgrade pip
          pip install freqtrade
          pip install psycopg2-binary
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Prepare Freqtrade user_data layout
        run: |
          mkdir -p user_data/strategies
          mkdir -p user_data/logs
          # Same strategy file as spot — it auto-detects futures mode
          # from trading_mode in the config, no separate strategy needed.
          if [ -e user_data/strategies/NostalgiaForInfinityX7.py ]; then
            echo "Strategy file already present at destination (symlink from repo layout) — skipping copy."
          else
            cp NostalgiaForInfinityX7.py user_data/strategies/
          fi
          cp config_dryrun_futures.json user_data/config.json

      - name: Clean old database to prevent KeyValueStore errors
        run: |
          # Remove local SQLite database if it exists (from previous runs)
          rm -f tradesv3.sqlite
          rm -f user_data/tradesv3.sqlite
          echo "Old database files cleaned (if any existed)."

      - name: Run Freqtrade (dry-run, background) and tail logs
        env:
          FREQTRADE__TELEGRAM__TOKEN: ${{ secrets.TELEGRAM_TOKEN_FUTURES }}
          FREQTRADE__TELEGRAM__CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FUTURES_DB_URL: ${{ secrets.SUPABASE_DB_URL_FUTURES }}
          TOKEN: ${{ secrets.TELEGRAM_TOKEN_FUTURES }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd user_data/..

          # futures_bot's search_path is fixed server-side (via
          # ALTER ROLE futures_bot SET search_path TO futures, public;
          # in Supabase's SQL editor) — so this connection lands in the
          # 'futures' schema automatically, no query-string tricks needed.
          # (An earlier attempt using ?options=-csearch_path=... on the
          # shared postgres user was confirmed NOT to work — Supabase's
          # pooler silently ignores that connection parameter.)
          export FREQTRADE__DB_URL="$FUTURES_DB_URL"

          SELF_TIMEOUT_SECONDS=$((5*3600 + 45*60))

          timeout --signal=TERM "${SELF_TIMEOUT_SECONDS}s" freqtrade trade \
            --config user_data/config.json \
            --strategy NostalgiaForInfinityX7 \
            --logfile user_data/logs/freqtrade.log &
          FREQTRADE_PID=$!

          QUEUE_LEAD_SECONDS=120
          (
            sleep $((SELF_TIMEOUT_SECONDS - QUEUE_LEAD_SECONDS))
            echo "Queueing the next run now (this run stops in ~${QUEUE_LEAD_SECONDS}s)..."
            curl -s -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/dry-run-telegram-futures.yml/dispatches" \
              -d "{\"ref\": \"${{ github.ref_name }}\"}"
          ) &
          QUEUE_PID=$!

          external_cancel_handler() {
            echo "Received external termination signal — forwarding to freqtrade (PID $FREQTRADE_PID) for graceful shutdown..."
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" \
              -d text="⚠️ NFI FUTURES (OKX) dry-run (run #${{ github.run_number }}) was cancelled externally — shutting down gracefully. Open simulated trades are safe (already saved to the database)." \
              > /dev/null || true
            kill -TERM "$FREQTRADE_PID" 2>/dev/null || true
            wait "$FREQTRADE_PID" 2>/dev/null || true
            exit 0
          }
          trap external_cancel_handler SIGTERM SIGINT

          sleep 20
          tail -f user_data/logs/freqtrade.log &
          TAIL_PID=$!

          wait $FREQTRADE_PID || true
          kill $TAIL_PID 2>/dev/null || true
          kill $QUEUE_PID 2>/dev/null || true

          echo "Planned self-restart: freqtrade ran for its allotted ${SELF_TIMEOUT_SECONDS}s and stopped on its own — this is expected, not a failure."
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="🔁 NFI FUTURES (OKX) dry-run (run #${{ github.run_number }}) completed its planned ${SELF_TIMEOUT_SECONDS}s session and is stopping on schedule. The next run was already queued and should start immediately." \
            > /dev/null || true

          exit 0

      - name: Notify Telegram — futures workflow failed
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN_FUTURES }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="❌ NFI FUTURES (OKX) dry-run workflow (run #${{ github.run_number }}) FAILED. Check GitHub Actions logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null || true
