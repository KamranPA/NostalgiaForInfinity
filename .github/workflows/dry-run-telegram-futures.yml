# SAVE THIS FILE AS: .github/workflows/dry-run-telegram-futures.yml
# (in .github/workflows/, alongside dry-run-telegram-signals.yml)
name: NFI Futures Dry-Run Telegram Signals (OKX)

# Same architecture as dry-run-telegram-signals.yml (the spot workflow) —
# see that file's header comment for the full explanation of the
# self-queueing restart chain and the local-SQLite-plus-git-branch
# persistence approach (which replaced Postgres/Supabase entirely after
# pg_stat_statements showed freqtrade's own internal polling/Telegram-RPC
# loop generates millions of tiny queries over a session's lifetime —
# fine locally, but enough to repeatedly blow through Supabase's
# free-tier egress quota even after several rounds of schema/role fixes).
#
# Differences from the spot workflow:
#   - config_dryrun_futures.json instead of config_dryrun_telegram.json
#   - state persisted on its own branch (state-futures), separate from
#     spot's (state-spot), so the two never collide
#   - concurrency group is separate (nfi-dryrun-futures) so this doesn't
#     interfere with the spot workflow's own restart chain
#   - uses its OWN dedicated Telegram bot (TELEGRAM_TOKEN_FUTURES secret)
#     — sharing spot's bot token caused a `telegram.error.Conflict`
#     (Telegram only allows one long-poll listener per bot token)

on:
  workflow_dispatch: {}

concurrency:
  group: nfi-dryrun-futures
  cancel-in-progress: false

permissions:
  contents: write   # read for checkout; write so this run can push the state-futures branch
  actions: write    # so this run's own GITHUB_TOKEN can queue the next run

jobs:
  dryrun-futures:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Notify Telegram — futures workflow started
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN_FUTURES }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="🔄 NFI FUTURES (OKX) dry-run workflow started (run #${{ github.run_number }}). Freqtrade is now installing/starting up...")
          echo "Telegram API response: $RESPONSE"
          if ! echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "::warning::Telegram did not accept the message — check TELEGRAM_TOKEN_FUTURES/TELEGRAM_CHAT_ID secrets."
          fi

      - name: Verify required secrets are set
        run: |
          MISSING=""
          [ -z "${{ secrets.TELEGRAM_TOKEN_FUTURES }}" ] && MISSING="$MISSING TELEGRAM_TOKEN_FUTURES"
          [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ] && MISSING="$MISSING TELEGRAM_CHAT_ID"
          if [ -n "$MISSING" ]; then
            echo "::error::These GitHub Secrets are empty or not set:$MISSING — go to Settings > Secrets and variables > Actions and add them."
            exit 1
          fi
          echo "All required secrets are present (values not shown here for security)."
          echo "(SUPABASE_DB_URL_FUTURES and the futures_bot Postgres role are no longer needed — persistence is now local SQLite + git, see file header.)"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed so later steps can fetch/create the state-futures branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-nfi-futures-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-nfi-futures-

      - name: Install TA-Lib system library
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget
          wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib
          ./configure --prefix=/usr
          make
          sudo make install
          cd ..

      - name: Install Freqtrade + dependencies
        run: |
          python -m pip install --upgrade pip
          pip install freqtrade
          # psycopg2-binary is no longer needed — db_url is local SQLite now.
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Prepare Freqtrade user_data layout
        run: |
          mkdir -p user_data/strategies
          mkdir -p user_data/logs
          if [ -e user_data/strategies/NostalgiaForInfinityX7.py ]; then
            echo "Strategy file already present at destination (symlink from repo layout) — skipping copy."
          else
            cp NostalgiaForInfinityX7.py user_data/strategies/
          fi
          cp config_dryrun_futures.json user_data/config.json

      - name: Restore previous SQLite state (if any)
        run: |
          git fetch origin state-futures 2>/dev/null && \
            git show origin/state-futures:tradesv3.dryrun_futures.sqlite > user_data/tradesv3.dryrun_futures.sqlite 2>/dev/null && \
            echo "Restored previous state ($(du -h user_data/tradesv3.dryrun_futures.sqlite | cut -f1))." || \
            echo "No previous state found (first run, or state-futures branch doesn't exist yet) — starting fresh."

      - name: Run Freqtrade (dry-run, background) and tail logs
        env:
          FREQTRADE__TELEGRAM__TOKEN: ${{ secrets.TELEGRAM_TOKEN_FUTURES }}
          FREQTRADE__TELEGRAM__CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOKEN: ${{ secrets.TELEGRAM_TOKEN_FUTURES }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd user_data/..

          SELF_TIMEOUT_SECONDS=$((5*3600 + 45*60))

          timeout --signal=TERM "${SELF_TIMEOUT_SECONDS}s" freqtrade trade \
            --config user_data/config.json \
            --strategy NostalgiaForInfinityX7 \
            --logfile user_data/logs/freqtrade.log &
          FREQTRADE_PID=$!

          QUEUE_LEAD_SECONDS=120
          (
            sleep $((SELF_TIMEOUT_SECONDS - QUEUE_LEAD_SECONDS))
            echo "Queueing the next run now (this run stops in ~${QUEUE_LEAD_SECONDS}s)..."
            curl -s -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/dry-run-telegram-futures.yml/dispatches" \
              -d "{\"ref\": \"${{ github.ref_name }}\"}"
          ) &
          QUEUE_PID=$!

          external_cancel_handler() {
            echo "Received external termination signal — forwarding to freqtrade (PID $FREQTRADE_PID) for graceful shutdown..."
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" \
              -d text="⚠️ NFI FUTURES (OKX) dry-run (run #${{ github.run_number }}) was cancelled externally — shutting down gracefully. State will still be saved." \
              > /dev/null || true
            kill -TERM "$FREQTRADE_PID" 2>/dev/null || true
            wait "$FREQTRADE_PID" 2>/dev/null || true
            exit 0
          }
          trap external_cancel_handler SIGTERM SIGINT

          sleep 20
          tail -f user_data/logs/freqtrade.log &
          TAIL_PID=$!

          wait $FREQTRADE_PID || true
          kill $TAIL_PID 2>/dev/null || true
          kill $QUEUE_PID 2>/dev/null || true

          echo "Planned self-restart: freqtrade ran for its allotted ${SELF_TIMEOUT_SECONDS}s and stopped on its own — this is expected, not a failure."
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="🔁 NFI FUTURES (OKX) dry-run (run #${{ github.run_number }}) completed its planned ${SELF_TIMEOUT_SECONDS}s session and is stopping on schedule. State is being saved; the next run was already queued and should start immediately." \
            > /dev/null || true

          exit 0

      - name: Save SQLite state (persist across restarts)
        if: always()
        run: |
          SQLITE_FILE="user_data/tradesv3.dryrun_futures.sqlite"
          if [ ! -f "$SQLITE_FILE" ]; then
            echo "No SQLite file found — freqtrade may have failed before creating it. Skipping state save."
            exit 0
          fi
          cp "$SQLITE_FILE" /tmp/state_backup_futures.sqlite

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan state-futures-tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/state_backup_futures.sqlite tradesv3.dryrun_futures.sqlite
          git add tradesv3.dryrun_futures.sqlite
          git commit -m "state sync $(date -u +%Y-%m-%dT%H:%M:%SZ) run #${{ github.run_number }}" --quiet
          git push origin state-futures-tmp:state-futures --force
          echo "State saved to state-futures branch ($(du -h /tmp/state_backup_futures.sqlite | cut -f1))."

      - name: Notify Telegram — futures workflow failed
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN_FUTURES }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="❌ NFI FUTURES (OKX) dry-run workflow (run #${{ github.run_number }}) FAILED. Check GitHub Actions logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null
