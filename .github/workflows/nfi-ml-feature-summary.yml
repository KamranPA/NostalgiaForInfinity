# SAVE THIS FILE AS: .github/workflows/nfi-ml-feature-summary.yml
# (in .github/workflows/, alongside the other workflow files)
name: NFI ML Feature Export (daily summary)

# Runs once a day and also stays available for manual runs from the
# Actions tab. Cron times are UTC. 06:00 UTC here — change the minute/hour
# below if you want a different time of day.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ml-feature-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary pandas

      - name: Run ML feature export and post summary to Telegram
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          SUMMARY=$(python ml_feature_export.py "$DB_URL" --telegram 2>&1)
          echo "$SUMMARY"

          MSG=$(printf '%s' "$SUMMARY")

          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}"
