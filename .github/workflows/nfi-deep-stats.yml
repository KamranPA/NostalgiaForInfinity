# SAVE THIS FILE AS: .github/workflows/nfi-deep-stats.yml
# (in .github/workflows/, alongside the other workflow files)
name: NFI Deep Signal Diagnostics (on-demand)

# Manual only — run this from the Actions tab whenever you want the deeper
# breakdown: enter-tag performance, open-trade tag history, duration vs
# outcome correlation, time-clustering of open trades, and DCA/rebuy
# activity. Reads directly from a bot's own local SQLite file, restored
# from its git state branch (state-spot / state-futures) — read-only,
# never writes to or affects the running bot. Runs once for spot and
# once for futures (matrix), posting separate Telegram messages.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deep-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - mode: spot
            state_branch: state-spot
            sqlite_file: tradesv3.dryrun.sqlite
            label: "🟢 SPOT"
          - mode: futures
            state_branch: state-futures
            sqlite_file: tradesv3.dryrun_futures.sqlite
            label: "🟣 FUTURES"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to fetch the state branch below

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Fetch ${{ matrix.mode }} SQLite state
        run: |
          git fetch origin ${{ matrix.state_branch }}
          git show origin/${{ matrix.state_branch }}:${{ matrix.sqlite_file }} > ${{ matrix.sqlite_file }}
          sqlite3 ${{ matrix.sqlite_file }} "PRAGMA integrity_check;" > /dev/null

      - name: Run deep signal diagnostics and post to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          OUTPUT=$(python signal_deep_stats.py "${{ matrix.sqlite_file }}" 2>&1)
          echo "$OUTPUT"

          # Telegram messages are capped at 4096 chars. This report is
          # longer than the basic stats report, so it's split into two
          # messages (first half / second half) instead of truncating —
          # otherwise the DCA/rebuy and clustering sections at the end
          # would get cut off.
          LEN=${#OUTPUT}
          HALF=$((LEN / 2))
          PART1="${OUTPUT:0:$HALF}"
          PART2="${OUTPUT:$HALF}"

          MSG1=$(printf '📊 NFI Deep Diagnostics — ${{ matrix.label }} (1/2)\n\n%s' "$PART1")
          MSG2=$(printf '📊 NFI Deep Diagnostics — ${{ matrix.label }} (2/2)\n\n%s' "$PART2")

          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG1}"

          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG2}"
