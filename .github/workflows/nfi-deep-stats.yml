# SAVE THIS FILE AS: .github/workflows/nfi-deep-stats.yml
# (in the ROOT of your NostalgiaForInfinity repo, alongside the other
# workflow files — same folder as nfi-signal-stats.yml)
name: NFI Deep Signal Diagnostics (on-demand)

# Manual only — run this from the Actions tab whenever you want the deeper
# breakdown: enter-tag performance, open-trade tag history, duration vs
# outcome correlation, time-clustering of open trades, and DCA/rebuy
# activity. Reads directly from the same Supabase Postgres database the
# bot itself uses (read-only — never writes to or affects the running bot).
#
# Uses the SAME secrets already configured for nfi-signal-stats.yml —
# no new secrets need to be added.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deep-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary numpy

      - name: Run deep signal diagnostics and post to Telegram
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          OUTPUT=$(python signal_deep_stats.py "$DB_URL" 2>&1)
          echo "$OUTPUT"

          # Telegram messages are capped at 4096 chars. This report is
          # longer than the basic stats report, so it's split into two
          # messages (first half / second half) instead of truncating —
          # otherwise the DCA/rebuy and clustering sections at the end
          # would get cut off.
          LEN=${#OUTPUT}
          HALF=$((LEN / 2))
          PART1="${OUTPUT:0:$HALF}"
          PART2="${OUTPUT:$HALF}"

          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=📊 NFI Deep Diagnostics (1/2)

${PART1}"

          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=📊 NFI Deep Diagnostics (2/2)

${PART2}"
