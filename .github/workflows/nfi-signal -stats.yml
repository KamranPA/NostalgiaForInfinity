# SAVE THIS FILE AS: .github/workflows/nfi-signal-stats.yml
# (in .github/workflows/, alongside the other workflow files)
name: NFI Signal Stats (on-demand)

# Manual only — run this from the Actions tab whenever you want a fresh
# summary of a dry-run bot's actual trade history. Reads directly from
# that bot's own local SQLite file, restored from its git state branch
# (state-spot / state-futures) — read-only, this never writes to or
# affects the running bot in any way. Runs once for spot and once for
# futures (matrix), posting two separate Telegram messages.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - mode: spot
            state_branch: state-spot
            sqlite_file: tradesv3.dryrun.sqlite
            label: "🟢 SPOT"
          - mode: futures
            state_branch: state-futures
            sqlite_file: tradesv3.dryrun_futures.sqlite
            label: "🟣 FUTURES"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to fetch the state branch below

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Fetch ${{ matrix.mode }} SQLite state
        run: |
          git fetch origin ${{ matrix.state_branch }}
          git show origin/${{ matrix.state_branch }}:${{ matrix.sqlite_file }} > ${{ matrix.sqlite_file }}
          sqlite3 ${{ matrix.sqlite_file }} "PRAGMA integrity_check;" > /dev/null

      - name: Run signal stats and post to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          OUTPUT=$(python signal_stats.py "${{ matrix.sqlite_file }}" 2>&1)
          echo "$OUTPUT"

          # Telegram messages are capped at 4096 chars — truncate safely
          # if the report grows past that as more pairs/trades accumulate.
          TRUNCATED=$(printf '📊 NFI Signal Stats — ${{ matrix.label }}\n\n%s' "$OUTPUT" | cut -c1-3900)

          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TRUNCATED}"
