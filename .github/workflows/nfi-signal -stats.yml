# SAVE THIS FILE AS: .github/workflows/nfi-signal-stats.yml
# (in the ROOT of your NostalgiaForInfinity repo, alongside the other
# workflow file)
name: NFI Signal Stats (on-demand)

# Manual only — run this from the Actions tab whenever you want a fresh
# summary of the dry-run bot's actual trade history. Reads directly from
# the same Supabase Postgres database the bot itself uses (read-only —
# this never writes to or affects the running bot in any way).

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary numpy

      - name: Run signal stats and post to Telegram
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          OUTPUT=$(python signal_stats.py "$DB_URL" 2>&1)
          echo "$OUTPUT"

          # Telegram messages are capped at 4096 chars — truncate safely
          # if the report grows past that as more pairs/trades accumulate.
          TRUNCATED=$(printf '📊 NFI Signal Stats\n\n%s' "$OUTPUT" | cut -c1-3900)

          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TRUNCATED}"
