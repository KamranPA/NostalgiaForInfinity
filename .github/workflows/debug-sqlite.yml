name: Debug SQLite
on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: state-futures

      - name: Inspect sqlite
        run: |
          echo "--- FILE INFO ---"
          ls -la
          echo "--- TABLES ---"
          sqlite3 tradesv3.dryrun_futures.sqlite ".tables"
          echo "--- TRADE COUNT ---"
          sqlite3 tradesv3.dryrun_futures.sqlite "SELECT count(*) FROM trades;"
          echo "--- CLOSED TRADES ---"
          sqlite3 tradesv3.dryrun_futures.sqlite "SELECT id,pair,close_profit,is_open FROM trades WHERE is_open=0;"
          echo "--- DONE ---"
