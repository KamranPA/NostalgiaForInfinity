# SAVE THIS FILE AS: .github/workflows/dryrun-watchdog.yml
# (in .github/workflows/, alongside the other workflow files)
name: Dry-Run Watchdog (safety net, internal cron)

# WHY THIS EXISTS
# ------------------------------------------------------------
# The futures dry-run workflows — dry-run-telegram-futures.yml (X7ML futures),
# dry-run-telegram-futures-x8.yml (X8 futures) and
# dry-run-telegram-futures-x8guard.yml (X8 Guard futures) — keep themselves
# alive by dispatching their own next run a couple minutes before each
# session ends. That self-queueing chain has one gap: if a run crashes
# BEFORE it queues its successor, nothing restarts it.
#
# This workflow is that safety net. It checks each workflow's most recent
# runs via the GitHub API and only dispatches a new run if NONE of the
# recent runs are still active (in_progress / queued / waiting /
# requested / pending), so it never stacks duplicate runs.
#
# SPOT DISABLED (2026-10-15): the two spot bots (X7ML spot
# dry-run-telegram-signals.yml and X8 spot dry-run-telegram-signals-x8.yml)
# are intentionally switched off while futures are being studied, so this
# watchdog no longer checks them. To bring spot back later: re-enable the
# two spot workflows in the Actions tab and add their check steps back here
# (otherwise the chain won't self-heal after a crash).
#
# X8 / GUARD NOTE: the watchdog also STARTS a workflow that has never been
# run (or has stopped) — it can't tell "never started" from "crashed". So
# the secrets (TELEGRAM_TOKEN_FUTURES_X8 / TELEGRAM_TOKEN_FUTURES_X8GUARD)
# must exist, otherwise each cycle dispatches a run that fails at its
# "Verify required secrets" step.

on:
  schedule:
    - cron: "0 * * * *"   # hourly — slow enough to stay within the free-tier quota,
                            # fast enough as a safety net for ~5h session lengths
  workflow_dispatch: {}       # for manually testing the check logic on demand

concurrency:
  group: nfi-dryrun-watchdog
  cancel-in-progress: true    # safe to cancel a stale check — it's stateless

permissions:
  contents: read
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check and restart futures dry-run if it has stopped
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/workflows/scripts/watchdog_check.sh \
            "dry-run-telegram-futures.yml" \
            "${{ github.repository }}" \
            "${{ github.ref_name }}"

      - name: Check and restart X8 futures dry-run if it has stopped
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/workflows/scripts/watchdog_check.sh \
            "dry-run-telegram-futures-x8.yml" \
            "${{ github.repository }}" \
            "${{ github.ref_name }}"

      - name: Check and restart X8 Guard futures dry-run if it has stopped
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/workflows/scripts/watchdog_check.sh \
            "dry-run-telegram-futures-x8guard.yml" \
            "${{ github.repository }}" \
            "${{ github.ref_name }}"

      - name: Notify Telegram if anything was restarted by the watchdog
        if: always()
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ ! -f /tmp/watchdog_restarted.txt ]; then
            echo "Nothing was restarted this cycle — no notification needed."
            exit 0
          fi
          RESTARTED=$(paste -sd ', ' /tmp/watchdog_restarted.txt)
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="🛡️ Watchdog restarted a dry-run that had stopped unexpectedly: ${RESTARTED}. Check the Actions tab if this happens repeatedly — it usually means something is crashing before it can queue its own next run." \
            > /dev/null || true
