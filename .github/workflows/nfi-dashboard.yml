# SAVE THIS FILE AS: .github/workflows/nfi-dashboard.yml
# (in the ROOT of your NostalgiaForInfinity repo, alongside the other
# workflow files)
name: NFI Dashboard

# Generates docs/index.html from the live Supabase database and commits
# it back to the repo. GitHub Pages (once enabled — see setup note below)
# then serves that file automatically at:
#   https://<username>.github.io/NostalgiaForInfinity/
#
# This workflow only READS from the database (via generate_dashboard.py)
# and only ever writes docs/index.html in this repo — it never touches
# the running bot or places any orders.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 * * * *"   # regenerate every hour — cheap and fast (~1 min), unlike the 6h trading job

permissions:
  contents: write   # needed to commit the generated docs/index.html back to the repo

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary numpy ccxt

      - name: Generate combined dashboard (spot + futures)
        env:
          BASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p docs

          # Spot reads the default 'public' schema (no change needed).
          SPOT_DB_URL="$BASE_DB_URL"

          # Futures reads the separate 'futures' schema in the SAME
          # Supabase project — same trick used in
          # dry-run-telegram-futures.yml, so both the bot and this
          # dashboard agree on where futures data lives.
          if [[ "$BASE_DB_URL" == *"?"* ]]; then
            FUTURES_DB_URL="${BASE_DB_URL}&options=-csearch_path%3Dfutures"
          else
            FUTURES_DB_URL="${BASE_DB_URL}?options=-csearch_path%3Dfutures"
          fi

          python generate_dashboard.py "$SPOT_DB_URL" "$FUTURES_DB_URL" docs/index.html

      - name: Commit and push docs/index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          # Only commit if the file actually changed — avoids empty
          # no-op commits cluttering history when nothing new happened.
          if git diff --cached --quiet; then
            echo "No changes to the dashboard — skipping commit."
          else
            git commit -m "chore: update NFI dashboard [skip ci]"
            git push
          fi
