# SAVE THIS FILE AS: .github/workflows/nfi-dashboard.yml
# (in .github/workflows/, alongside the other workflow files)
name: NFI Dashboard

# Reads ALL FIVE bots' live trading state directly from their SQLite state
# branches:
#   X7ML spot      -> state-spot            (tradesv3.dryrun.sqlite)
#   X7ML futures   -> state-futures         (tradesv3.dryrun_futures.sqlite)
#   X8 spot        -> state-spot-x8         (tradesv3.dryrun_x8.sqlite)
#   X8 futures     -> state-futures-x8      (tradesv3.dryrun_futures_x8.sqlite)
#   X8 Guard fut.  -> state-futures-x8guard (tradesv3.dryrun_futures_x8guard.sqlite)
# (the same files the dry-run-*.yml workflows persist across restarts)
# instead of a Postgres database.
#
# FIVE PAGES are produced:
#   docs/index.html    — MAIN dashboard: only stats grid, Capital Efficiency,
#                        Equity Curve and True Total & Stuck for all 5 bots
#                        (generate_dashboard_overview.py)
#   docs/details.html  — trade tables + ML/analytics for all bots (same script)
#   docs/classic.html  — the old full X7ML page (generate_dashboard.py,
#                        unchanged; it still runs because it records the
#                        spot/futures history snapshots)
#   docs/compare.html  — X7ML vs X8 head-to-head (generate_dashboard_compare.py)
#   docs/guard.html    — X8 vs X8 Guard head-to-head (generate_dashboard_guard.py)
# Every page except index.html is built with continue-on-error so a problem
# in one can never stop the others from updating.
#
# This workflow's OWN read/write is to a separate branch
# (dashboard-history) that holds nothing but the trend-chart history.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */1 * * *"   # every hour

permissions:
  contents: write   # needed to commit the updated dashboard-history file back

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to fetch the state-*/dashboard-history branches

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy ccxt

      - name: Fetch SQLite state of all five bots
        run: |
          mkdir -p /tmp/dashboard_data

          git fetch origin state-spot 2>/dev/null && \
            git show origin/state-spot:tradesv3.dryrun.sqlite > /tmp/dashboard_data/spot.sqlite 2>/dev/null && \
            echo "Spot (X7ML) state found ($(du -h /tmp/dashboard_data/spot.sqlite | cut -f1))." || \
            echo "No spot (X7ML) state yet (bot may not have completed a session yet) — dashboard will show it as empty."

          git fetch origin state-futures 2>/dev/null && \
            git show origin/state-futures:tradesv3.dryrun_futures.sqlite > /tmp/dashboard_data/futures.sqlite 2>/dev/null && \
            echo "Futures (X7ML) state found ($(du -h /tmp/dashboard_data/futures.sqlite | cut -f1))." || \
            echo "No futures (X7ML) state yet (bot may not have completed a session yet) — dashboard will show it as empty."

          git fetch origin state-spot-x8 2>/dev/null && \
            git show origin/state-spot-x8:tradesv3.dryrun_x8.sqlite > /tmp/dashboard_data/spot_x8.sqlite 2>/dev/null && \
            echo "Spot (X8) state found ($(du -h /tmp/dashboard_data/spot_x8.sqlite | cut -f1))." || \
            echo "No spot (X8) state yet (first hourly checkpoint not pushed yet) — comparison page will show it as empty."

          git fetch origin state-futures-x8 2>/dev/null && \
            git show origin/state-futures-x8:tradesv3.dryrun_futures_x8.sqlite > /tmp/dashboard_data/futures_x8.sqlite 2>/dev/null && \
            echo "Futures (X8) state found ($(du -h /tmp/dashboard_data/futures_x8.sqlite | cut -f1))." || \
            echo "No futures (X8) state yet (first hourly checkpoint not pushed yet) — comparison page will show it as empty."

          git fetch origin state-futures-x8guard 2>/dev/null && \
            git show origin/state-futures-x8guard:tradesv3.dryrun_futures_x8guard.sqlite > /tmp/dashboard_data/futures_x8guard.sqlite 2>/dev/null && \
            echo "Futures (X8 Guard) state found ($(du -h /tmp/dashboard_data/futures_x8guard.sqlite | cut -f1))." || \
            echo "No futures (X8 Guard) state yet (first hourly checkpoint not pushed yet) — Guard page will show a placeholder."

      - name: Fetch (or initialize) dashboard history
        run: |
          git fetch origin dashboard-history 2>/dev/null && \
            git show origin/dashboard-history:history.sqlite > /tmp/dashboard_data/history.sqlite 2>/dev/null && \
            echo "Existing dashboard history found ($(du -h /tmp/dashboard_data/history.sqlite | cut -f1))." || \
            echo "No dashboard history yet — trend chart will start fresh from this run."

      - name: Generate combined dashboard (X7ML spot + futures)
        run: |
          mkdir -p docs
          python generate_dashboard.py \
            /tmp/dashboard_data/spot.sqlite \
            /tmp/dashboard_data/futures.sqlite \
            /tmp/dashboard_data/history.sqlite \
            docs/classic.html

      - name: Generate X7ML vs X8 comparison page
        continue-on-error: true
        run: |
          python generate_dashboard_compare.py \
            /tmp/dashboard_data/spot.sqlite \
            /tmp/dashboard_data/futures.sqlite \
            /tmp/dashboard_data/spot_x8.sqlite \
            /tmp/dashboard_data/futures_x8.sqlite \
            /tmp/dashboard_data/history.sqlite \
            docs/compare.html

      - name: Generate X8 vs X8 Guard page
        continue-on-error: true
        run: |
          python generate_dashboard_guard.py \
            /tmp/dashboard_data/futures_x8.sqlite \
            /tmp/dashboard_data/futures_x8guard.sqlite \
            /tmp/dashboard_data/history.sqlite \
            docs/guard.html

      - name: Generate main page (index) + details page
        # Runs AFTER the other pages: it only reads the history file and
        # never records snapshots, so nothing is double-counted.
        continue-on-error: true
        run: |
          python generate_dashboard_overview.py \
            /tmp/dashboard_data/spot.sqlite \
            /tmp/dashboard_data/futures.sqlite \
            /tmp/dashboard_data/spot_x8.sqlite \
            /tmp/dashboard_data/futures_x8.sqlite \
            /tmp/dashboard_data/futures_x8guard.sqlite \
            /tmp/dashboard_data/history.sqlite \
            docs/index.html \
            docs/details.html

      - name: Commit and push docs pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/classic.html
          [ -f docs/index.html ] && git add docs/index.html || true
          [ -f docs/details.html ] && git add docs/details.html || true
          [ -f docs/compare.html ] && git add docs/compare.html || true
          [ -f docs/guard.html ] && git add docs/guard.html || true
          git diff --cached --quiet && echo "No dashboard changes to commit." || \
            (git commit -m "Update dashboard $(date -u +%Y-%m-%dT%H:%M:%SZ)" --quiet && git push origin HEAD:${{ github.ref_name }})

      - name: Save updated dashboard history
        if: always()
        run: |
          if [ ! -f /tmp/dashboard_data/history.sqlite ]; then
            echo "No history file produced — skipping history save."
            exit 0
          fi
          # This branch keeps a normal, incrementally-growing commit
          # history — that's what lets the trend chart accumulate points
          # over time instead of only ever showing one snapshot.
          git fetch origin dashboard-history 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/dashboard-history; then
            git checkout -B dashboard-history origin/dashboard-history --quiet
          else
            git checkout --orphan dashboard-history --quiet
            git rm -rf . > /dev/null 2>&1 || true
          fi
          cp /tmp/dashboard_data/history.sqlite history.sqlite
          git add history.sqlite
          git diff --cached --quiet && echo "No history changes to commit." || \
            git commit -m "history sync $(date -u +%Y-%m-%dT%H:%M:%SZ) run #${{ github.run_number }}" --quiet
          git push origin dashboard-history --quiet
          echo "Dashboard history saved."
