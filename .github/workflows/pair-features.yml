# SAVE THIS FILE AS: .github/workflows/pair-features.yml
# ONE-SHOT, read-only. Downloads DAILY OKX candles of the pairs of finished backtest runs,
# builds pair features (volatility, drops, volume spikes, age, relation to BTC ...) and
# compares them with the trade outcomes of those runs. No backtest is re-run.
# Needs pair_features.py in the repo root and config_dryrun_futures.json (already there).
#
# Input run_ids: backtest run IDs, comma separated. FIRST = discovery period, SECOND = check
#                on an independent period. Both runs must still have their artifacts
#                "backtest-<id>" and "pairlist-<id>" (GitHub keeps artifacts for 30 days).
# Output: artifact "pair-features" (report.md, trades_with_features.csv, pair_features_daily.csv.gz)
#         and the report in the Job Summary.
name: Pair features vs trade outcomes

on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: "Backtest run IDs, comma separated (first = discovery, second = check)"
        required: true
        default: "38149384304,38292059248"
      history_start:
        description: "First day of daily history to download (YYYYMMDD)"
        required: true
        default: "20240101"

permissions:
  contents: read
  actions: read

jobs:
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUN_IDS: ${{ inputs.run_ids }}
      HIST_START: ${{ inputs.history_start }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install freqtrade + pandas + pyarrow
        run: |
          python -m pip install --upgrade pip
          pip install freqtrade pandas pyarrow numpy

      - name: Download the backtest and pairlist artifacts of the runs
        run: |
          mkdir -p /tmp/pf/in /tmp/pf/out
          IFS=',' read -ra IDS <<< "$RUN_IDS"
          for raw in "${IDS[@]}"; do
            id=$(echo "$raw" | tr -d ' #')
            [ -z "$id" ] && continue
            echo "== run $id"
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --name "backtest-$id" -D "/tmp/pf/in/backtest-$id"
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --name "pairlist-$id" -D "/tmp/pf/in/pairlist-$id"
          done
          find /tmp/pf/in -maxdepth 3 | sort | head -40

      - name: Collect the pairs (pairlists + BTC)
        run: |
          RUNS=$(echo "$RUN_IDS" | tr -d ' #')
          python pair_features.py pairs --artifacts /tmp/pf/in --runs "$RUNS" --out /tmp/pf/pairs.json

      - name: Build download config (live futures config + StaticPairList)
        run: |
          mkdir -p user_data/data
          python3 << 'PYEOF'
          import json
          with open("config_dryrun_futures.json") as f:
              cfg = json.load(f)
          with open("/tmp/pf/pairs.json") as f:
              pairs = json.load(f)
          cfg["exchange"]["pair_whitelist"] = pairs
          cfg["pairlists"] = [{"method": "StaticPairList"}]
          cfg["telegram"] = {"enabled": False, "token": "", "chat_id": ""}
          with open("user_data/config.json", "w") as f:
              json.dump(cfg, f, indent=2)
          print(len(pairs), "pairs in the download config")
          PYEOF

      - name: Download daily OKX candles
        run: |
          # Daily candles only: small and quick (futures mode also fetches mark/funding data).
          freqtrade download-data \
            --config user_data/config.json \
            --exchange okx \
            --timerange "${HIST_START}-$(date -u +%Y%m%d)" \
            --timeframes 1d \
            --data-format-ohlcv feather
          find user_data/data -name '*-1d-futures.feather' | wc -l
          find user_data/data -name 'BTC_USDT_USDT-1d-futures.feather'

      - name: Build features and compare with the trades
        run: |
          RUNS=$(echo "$RUN_IDS" | tr -d ' #')
          python pair_features.py analyze \
            --data user_data/data \
            --artifacts /tmp/pf/in \
            --runs "$RUNS" \
            --out /tmp/pf/out \
            --history-start "$HIST_START"
          cat /tmp/pf/out/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pair-features
          path: /tmp/pf/out
          if-no-files-found: ignore
          retention-days: 30
