# SAVE THIS FILE AS: .github/workflows/dry-run-telegram.yml
# (create the .github/workflows/ folders if they don't exist yet, in the
# ROOT of your NostalgiaForInfinity repo)
name: NFI Dry-Run Telegram Signals

# Architecture summary:
# - dry_run: true in config_dryrun_telegram.json — NO real orders are ever
#   placed, regardless of anything in this workflow. Trades are simulated
#   against live market data and reported via Telegram.
# - GitHub Actions jobs have a hard 6-hour ceiling and aren't designed for
#   indefinite always-on processes, so this restarts periodically instead
#   of trying to run forever in one job.
# - SELF-QUEUEING restart chain (primary mechanism): a few minutes before
#   this run's own internal self-timeout expires, it calls GitHub's REST
#   API itself (using the automatic, built-in GITHUB_TOKEN — no extra
#   secret needed) to dispatch the NEXT run of this same workflow:
#     POST /repos/<owner>/<repo>/actions/workflows/dry-run-telegram-signals.yml/dispatches
#   Because `concurrency.cancel-in-progress` is FALSE below, that new run
#   doesn't cancel this one — GitHub QUEUES it instead, and starts it
#   automatically the instant this run finishes (exit 0). Net effect:
#   near-zero gap between runs, AND every run still completes and shows
#   green/Success on its own terms (no run ever gets killed by another).
# - EXTERNAL cron (e.g. cron-job.org calling the same dispatch endpoint
#   every ~6h with a separate PAT stored on the cron site) is kept ONLY
#   as a backup safety net, in case the self-queueing chain above ever
#   breaks (e.g. a crash before it gets to queue the next run). Because
#   queueing (not cancelling) is used, an extra/redundant dispatch from
#   the backup is harmless — it just sits queued.
# - Open simulated trades survive each restart because db_url points at
#   Supabase Postgres (set via secret), not local SQLite (which would be
#   wiped every time the runner's filesystem is discarded).

on:
  workflow_dispatch: {}   # triggered by the self-queueing chain above, and by the external cron backup

concurrency:
  group: nfi-dryrun-telegram
  # FALSE is deliberate and load-bearing: this makes a new dispatch queue
  # behind the current run instead of killing it, which is what lets the
  # self-queueing restart chain achieve near-zero gap without ever
  # showing a run as "Cancelled". See architecture summary above.
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # required so this run's own GITHUB_TOKEN can call the workflow-dispatch API to queue the next run

jobs:
  dryrun:
    runs-on: ubuntu-latest
    # This is now purely a last-resort safety net — the script itself
    # self-terminates gracefully (exit 0) after 5h45m, well before this
    # limit or the next external cron trigger (every 6h). 360 is
    # GitHub's actual maximum job runtime on hosted runners — setting it
    # any higher has no effect, GitHub caps it here regardless.
    timeout-minutes: 360

    steps:
      - name: Notify Telegram — workflow started
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Sent via a direct Bot API call, independent of Freqtrade's own
          # "startup" notification — this confirms the workflow actually
          # triggered even if Freqtrade later fails to start (e.g. a bad
          # db_url) and never gets far enough to send its own message.
          #
          # IMPORTANT: curl exiting successfully only means the HTTP
          # request completed — it does NOT mean Telegram accepted the
          # message. A bad token or chat_id returns a normal HTTP response
          # with {"ok": false, ...} in the body, which curl -s silently
          # discards if you don't capture and check it. Do that here.
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="🔄 NFI dry-run workflow started (run #${{ github.run_number }}). Freqtrade is now installing/starting up...")
          echo "Telegram API response: $RESPONSE"
          if ! echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "::warning::Telegram did not accept the message — see the API response above for the exact reason (common causes: wrong TELEGRAM_TOKEN secret, wrong TELEGRAM_CHAT_ID secret, or you haven't sent /start to your own bot yet in Telegram)."
          fi

      - name: Verify required secrets are set
        run: |
          # Catches an empty/missing secret in seconds instead of letting
          # the ~5 hour freqtrade run start with a broken config.
          MISSING=""
          [ -z "${{ secrets.TELEGRAM_TOKEN }}" ] && MISSING="$MISSING TELEGRAM_TOKEN"
          [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ] && MISSING="$MISSING TELEGRAM_CHAT_ID"
          [ -z "${{ secrets.SUPABASE_DB_URL }}" ] && MISSING="$MISSING SUPABASE_DB_URL"
          if [ -n "$MISSING" ]; then
            echo "::error::These GitHub Secrets are empty or not set:$MISSING — go to Settings > Secrets and variables > Actions and add them."
            exit 1
          fi
          echo "All required secrets are present (values not shown here for security)."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-nfi-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-nfi-

      - name: Install TA-Lib system library
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget
          wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib
          ./configure --prefix=/usr
          make
          sudo make install
          cd ..

      - name: Install Freqtrade + dependencies
        run: |
          python -m pip install --upgrade pip
          pip install freqtrade
          # psycopg2-binary is required for the postgresql:// db_url
          # (Supabase). Without it, freqtrade falls back to failing on
          # startup when it can't load the Postgres driver.
          pip install psycopg2-binary
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Prepare Freqtrade user_data layout
        run: |
          mkdir -p user_data/strategies
          mkdir -p user_data/logs
          # NostalgiaForInfinityX7.py lives at the repo root. Some layouts
          # of this repo already symlink it into user_data/strategies/,
          # in which case `cp` onto itself fails with "are the same
          # file" — only copy if the destination doesn't already exist.
          if [ -e user_data/strategies/NostalgiaForInfinityX7.py ]; then
            echo "Strategy file already present at destination (symlink from repo layout) — skipping copy."
          else
            cp NostalgiaForInfinityX7.py user_data/strategies/
          fi
          cp config_dryrun_telegram.json user_data/config.json

      - name: Run Freqtrade (dry-run, background) and tail logs
        env:
          # Real secret values injected via Freqtrade's native
          # FREQTRADE__<SECTION>__<KEY> environment-variable override
          # mechanism — nothing sensitive is ever written into the
          # committed config file.
          FREQTRADE__TELEGRAM__TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          FREQTRADE__TELEGRAM__CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FREQTRADE__DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd user_data/..

          SELF_TIMEOUT_SECONDS=$((5*3600 + 45*60))   # 5h45m — leaves ~10min buffer before both the external cron backup interval AND GitHub's own 6h hard cap on job runtime

          timeout --signal=TERM "${SELF_TIMEOUT_SECONDS}s" freqtrade trade \
            --config user_data/config.json \
            --strategy NostalgiaForInfinityX7 \
            --logfile user_data/logs/freqtrade.log &
          FREQTRADE_PID=$!

          # Self-queueing restart: a couple minutes before THIS run plans
          # to stop, ask GitHub to queue the NEXT run of this same
          # workflow. Because concurrency.cancel-in-progress is false
          # (see top of file), that new run doesn't kill this one — it
          # waits in GitHub's queue and starts the instant this run
          # finishes. That's what closes the gap to near-zero without
          # ever cancelling a run.
          QUEUE_LEAD_SECONDS=120   # queue ~2min before this run's planned stop
          (
            sleep $((SELF_TIMEOUT_SECONDS - QUEUE_LEAD_SECONDS))
            echo "Queueing the next run now (this run stops in ~${QUEUE_LEAD_SECONDS}s)..."
            curl -s -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/dry-run-telegram-signals.yml/dispatches" \
              -d "{\"ref\": \"${{ github.ref_name }}\"}"
          ) &
          QUEUE_PID=$!

          # Safety net only: if this run DOES get cancelled externally
          # anyway (e.g. someone manually re-triggers it early), still
          # shut down freqtrade cleanly rather than have it killed
          # mid-write.
          external_cancel_handler() {
            echo "Received external termination signal — forwarding to freqtrade (PID $FREQTRADE_PID) for graceful shutdown..."
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" \
              -d text="⚠️ NFI dry-run (run #${{ github.run_number }}) was cancelled externally (not the planned self-restart) — shutting down gracefully. Open simulated trades are safe (already saved to the database)." \
              > /dev/null || true
            kill -TERM "$FREQTRADE_PID" 2>/dev/null || true
            wait "$FREQTRADE_PID" 2>/dev/null || true
            exit 0
          }
          trap external_cancel_handler SIGTERM SIGINT

          sleep 20
          tail -f user_data/logs/freqtrade.log &
          TAIL_PID=$!

          # IMPORTANT: `|| true` here is required. GitHub Actions runs
          # multi-line bash steps with `-e` (errexit) by default, so if
          # `wait` returns non-zero — which happens whenever `timeout`
          # forwards SIGTERM to freqtrade at the self-timeout deadline,
          # even on a perfectly normal planned stop — the ENTIRE script
          # would abort right here, skipping the "planned stop" Telegram
          # message and the final `exit 0` below. That previously caused
          # runs to show red/failed at the self-timeout mark even though
          # nothing was actually wrong (observed: freqtrade's own
          # internal shutdown sequence hit a SQLAlchemy
          # PendingRollbackError while closing its DB connection after
          # receiving SIGTERM — happening for a hopefully-cosmetic reason
          # inside freqtrade/SQLAlchemy's shutdown path — but it doesn't
          # matter here: every trade state change is already committed
          # to Postgres before this point, so this is safe to ignore).
          wait $FREQTRADE_PID || true
          kill $TAIL_PID 2>/dev/null || true
          kill $QUEUE_PID 2>/dev/null || true

          echo "Planned self-restart: freqtrade ran for its allotted ${SELF_TIMEOUT_SECONDS}s and stopped on its own — this is expected, not a failure. The next run should already be queued and will start immediately."
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="🔁 NFI dry-run (run #${{ github.run_number }}) completed its planned ${SELF_TIMEOUT_SECONDS}s session and is stopping on schedule. The next run was already queued a couple minutes ago and should start immediately. Open simulated trades are safe (already saved to the database)." \
            > /dev/null || true

          # Exit 0 no matter what freqtrade/timeout returned (e.g.
          # `timeout`'s own 124 on expiry) — this planned stop is a
          # success, not a failure, so the job/run shows green.
          exit 0

      - name: Notify Telegram — workflow failed
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="❌ NFI dry-run workflow (run #${{ github.run_number }}) FAILED. Check GitHub Actions logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null
