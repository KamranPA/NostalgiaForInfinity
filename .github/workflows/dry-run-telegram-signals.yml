# SAVE THIS FILE AS: .github/workflows/dry-run-telegram-signals.yml
# (in .github/workflows/, in the ROOT of your NostalgiaForInfinity repo)
name: NFI Dry-Run Telegram Signals

# Architecture summary:
# - dry_run: true in config_dryrun_telegram.json — NO real orders are ever
#   placed, regardless of anything in this workflow.
# - SELF-QUEUEING restart chain: a couple minutes before this run's
#   internal self-timeout expires, it dispatches the NEXT run of this
#   same workflow via the GitHub API. concurrency.cancel-in-progress is
#   FALSE, so the new run queues instead of killing this one.
# - PERSISTENCE — LOCAL SQLITE + GIT STATE BRANCH (state-spot):
#   freqtrade uses a local SQLite file. To survive each ~5h45m restart,
#   this file is restored from — and saved back to — a dedicated git
#   branch (`state-spot`).
# - PERIODIC CHECKPOINT (added 2026-09-14): the full "Save SQLite state"
#   step only runs once, at the very end of each ~5h45m session — so a
#   trade opened mid-session was invisible to anything reading state-spot
#   (like the dashboard) for up to ~5h45m. Now a background loop pushes a
#   WAL-checkpointed copy of the live file to state-spot every hour WHILE
#   freqtrade keeps running, using its own throwaway git clone (never
#   touches this job's main checkout, so it can't disturb the running
#   freqtrade process or its already-loaded strategy file).
#
# FIX (2026-09-14): SQLite runs in WAL mode by default. Freshly written
# trade rows can sit in the "-wal" side file and never make it into the
# main .sqlite file if freqtrade doesn't fully checkpoint on shutdown.
# Both the periodic push above and the final "Save SQLite state" step
# force a WAL checkpoint before copying, so this can't happen anymore.
#
# ML STRATEGY SUBCLASS (added later): freqtrade is now pointed at
# NostalgiaForInfinityX7ML (a thin subclass in NostalgiaForInfinityX7ML.py
# that only adds order_filled() ML-snapshot logging) instead of the
# upstream NostalgiaForInfinityX7 class directly, so a future re-sync of
# NostalgiaForInfinityX7.py from iterativv/NostalgiaForInfinity can't wipe
# out this project's custom ML data-collection logic.

on:
  workflow_dispatch: {}

concurrency:
  group: nfi-dryrun-telegram
  cancel-in-progress: false

permissions:
  contents: write   # read for checkout; write so this run can push the state-spot branch
  actions: write    # so this run's own GITHUB_TOKEN can queue the next run

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Notify Telegram — workflow started
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="🟢 NFI SPOT (KuCoin) started — run #${{ github.run_number }} | dry-run | NostalgiaForInfinityX7ML | 5m")
          echo "Telegram API response: $RESPONSE"
          if ! echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "::warning::Telegram did not accept the message — check TELEGRAM_TOKEN/TELEGRAM_CHAT_ID secrets."
          fi

      - name: Verify required secrets are set
        run: |
          MISSING=""
          [ -z "${{ secrets.TELEGRAM_TOKEN }}" ] && MISSING="$MISSING TELEGRAM_TOKEN"
          [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ] && MISSING="$MISSING TELEGRAM_CHAT_ID"
          if [ -n "$MISSING" ]; then
            echo "::error::These GitHub Secrets are empty or not set:$MISSING — go to Settings > Secrets and variables > Actions and add them."
            exit 1
          fi
          echo "All required secrets are present (values not shown here for security)."

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed so later steps can fetch/create the state-spot branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-nfi-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-nfi-

      - name: Install TA-Lib system library
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget
          wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib
          ./configure --prefix=/usr
          make
          sudo make install
          cd ..

      - name: Install Freqtrade + dependencies
        run: |
          python -m pip install --upgrade pip
          pip install freqtrade
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Prepare Freqtrade user_data layout
        run: |
          mkdir -p user_data/strategies
          mkdir -p user_data/logs
          if [ -e user_data/strategies/NostalgiaForInfinityX7.py ]; then
            echo "Strategy file already present at destination (symlink from repo layout) — skipping copy."
          else
            cp NostalgiaForInfinityX7.py user_data/strategies/
          fi
          # ML subclass (NostalgiaForInfinityX7ML.py) imports
          # NostalgiaForInfinityX7 directly, so both files must sit
          # together in user_data/strategies/.
          if [ -e user_data/strategies/NostalgiaForInfinityX7ML.py ]; then
            echo "ML strategy file already present at destination — skipping copy."
          else
            cp NostalgiaForInfinityX7ML.py user_data/strategies/
          fi
          cp config_dryrun_telegram.json user_data/config.json

      - name: Restore previous SQLite state (if any)
        run: |
          git fetch origin state-spot 2>/dev/null && \
            git show origin/state-spot:tradesv3.dryrun.sqlite > user_data/tradesv3.dryrun.sqlite 2>/dev/null && \
            echo "Restored previous state ($(du -h user_data/tradesv3.dryrun.sqlite | cut -f1))." || \
            echo "No previous state found (first run, or state-spot branch doesn't exist yet) — starting fresh."

      - name: Run Freqtrade (dry-run, background) and tail logs
        env:
          FREQTRADE__TELEGRAM__TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          FREQTRADE__TELEGRAM__CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          cd user_data/..

          SELF_TIMEOUT_SECONDS=$((5*3600 + 15*60))
          CHECKPOINT_INTERVAL_SECONDS=3600   # hourly

          timeout --signal=TERM "${SELF_TIMEOUT_SECONDS}s" freqtrade trade \
            --config user_data/config.json \
            --strategy NostalgiaForInfinityX7ML \
            --logfile user_data/logs/freqtrade.log &
          FREQTRADE_PID=$!

          QUEUE_LEAD_SECONDS=120
          (
            sleep $((SELF_TIMEOUT_SECONDS - QUEUE_LEAD_SECONDS))
            echo "Queueing the next run now (this run stops in ~${QUEUE_LEAD_SECONDS}s)..."
            curl -s -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/dry-run-telegram-signals.yml/dispatches" \
              -d "{\"ref\": \"${{ github.ref_name }}\"}"
          ) &
          QUEUE_PID=$!

          # Periodic mid-session state push: keeps state-spot (and thus
          # the dashboard) reasonably fresh instead of only updating once
          # every ~5h45m. Uses its OWN throwaway git clone in /tmp so it
          # never touches this job's main checkout/working tree — the
          # running freqtrade process and its already-loaded files are
          # completely unaffected by this.
          (
            SQLITE_FILE="user_data/tradesv3.dryrun.sqlite"
            while true; do
              sleep "$CHECKPOINT_INTERVAL_SECONDS"
              if [ ! -f "$SQLITE_FILE" ]; then continue; fi
              sqlite3 "$SQLITE_FILE" "PRAGMA wal_checkpoint(TRUNCATE);" || true
              TMP_DIR=$(mktemp -d)
              cp "$SQLITE_FILE" "$TMP_DIR/tradesv3.dryrun.sqlite"
              (
                cd "$TMP_DIR"
                git init -q
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git checkout -q -b state-spot
                git add tradesv3.dryrun.sqlite
                git commit -q -m "periodic checkpoint sync $(date -u +%Y-%m-%dT%H:%M:%SZ) run #${{ github.run_number }}"
                git remote add origin "$REPO_URL"
                git push -q origin state-spot --force
              ) && echo "Periodic checkpoint pushed to state-spot at $(date -u)." \
                || echo "::warning::Periodic checkpoint push failed (will retry next interval)."
              rm -rf "$TMP_DIR"
            done
          ) &
          CHECKPOINT_PID=$!

          external_cancel_handler() {
            echo "Received external termination signal — forwarding to freqtrade (PID $FREQTRADE_PID) for graceful shutdown..."
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" \
              -d text="⚠️ NFI dry-run (run #${{ github.run_number }}) was cancelled externally — shutting down gracefully. State will still be saved." \
              > /dev/null || true
            kill -TERM "$FREQTRADE_PID" 2>/dev/null || true
            wait "$FREQTRADE_PID" 2>/dev/null || true
            exit 0
          }
          trap external_cancel_handler SIGTERM SIGINT

          sleep 20
          tail -f user_data/logs/freqtrade.log &
          TAIL_PID=$!

          wait $FREQTRADE_PID || true
          kill $TAIL_PID 2>/dev/null || true
          kill $QUEUE_PID 2>/dev/null || true
          kill $CHECKPOINT_PID 2>/dev/null || true

          echo "Planned self-restart: freqtrade ran for its allotted ${SELF_TIMEOUT_SECONDS}s and stopped on its own — this is expected, not a failure."
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="🔁 NFI dry-run (run #${{ github.run_number }}) completed its planned ${SELF_TIMEOUT_SECONDS}s session and is stopping on schedule. State is being saved; the next run was already queued and should start immediately." \
            > /dev/null || true

          exit 0

      - name: Save SQLite state (persist across restarts)
        if: always()
        run: |
          SQLITE_FILE="user_data/tradesv3.dryrun.sqlite"
          if [ ! -f "$SQLITE_FILE" ]; then
            echo "No SQLite file found — freqtrade may have failed before creating it. Skipping state save."
            exit 0
          fi

          echo "Forcing a full WAL checkpoint so all committed trade data is flushed into the main file..."
          sqlite3 "$SQLITE_FILE" "PRAGMA wal_checkpoint(TRUNCATE);"

          echo "Post-checkpoint sanity check — closed trade count in file about to be saved:"
          sqlite3 "$SQLITE_FILE" "SELECT count(*) FROM trades WHERE is_open=0;"

          cp "$SQLITE_FILE" /tmp/state_backup_spot.sqlite

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan state-spot-tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/state_backup_spot.sqlite tradesv3.dryrun.sqlite
          git add tradesv3.dryrun.sqlite
          git commit -m "state sync $(date -u +%Y-%m-%dT%H:%M:%SZ) run #${{ github.run_number }}" --quiet
          git push origin state-spot-tmp:state-spot --force
          echo "State saved to state-spot branch ($(du -h /tmp/state_backup_spot.sqlite | cut -f1))."

      - name: Notify Telegram — workflow failed
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="❌ NFI dry-run workflow (run #${{ github.run_number }}) FAILED. Check GitHub Actions logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null
