name: Run NostalgiaForInfinityX7 Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create directories
        run: |
          mkdir -p user_data/logs
          mkdir -p user_data/data
          mkdir -p user_data/configs

      - name: Copy config files into user_data
        run: |
          cp configs/trading_mode-futures.json user_data/configs/
          cp configs/pairlist-volume-binance-usdt.json user_data/configs/
          cp configs/blacklist-binance.json user_data/configs/
          cp configs/exampleconfig.json user_data/configs/
          cp configs/exampleconfig_secret.json user_data/configs/

      - name: Create config.json
        run: |
          cat > user_data/config.json << 'EOF'
          {
            "strategy": "NostalgiaForInfinityX7",
            "add_config_files": [
              "configs/trading_mode-futures.json",
              "configs/pairlist-volume-binance-usdt.json",
              "configs/blacklist-binance.json",
              "configs/exampleconfig.json",
              "configs/exampleconfig_secret.json"
            ]
          }
          EOF

      - name: Run Freqtrade Bot
        run: |
          docker compose up -d

      - name: Show initial logs
        run: |
          sleep 20
          docker compose logs --tail=100

      - name: Keep bot running
        run: |
          echo "Bot is running..."
          while true; do
            sleep 300
            docker compose logs --tail=30
          done
