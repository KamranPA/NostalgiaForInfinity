# SAVE THIS FILE AS: .github/workflows/backtest-signal-frequency.yml
# (in .github/workflows/, in the ROOT of your NostalgiaForInfinity repo)
name: Backtest Signal Frequency (last 30 days, spot)

# Manual-only, read-only diagnostic. Answers ONE question: "is the low
# entry frequency caused by a bug in code WE wrote (ML subclass,
# btc_info_timeframes override, pairlist config), or is it inherent to
# the strategy+market itself?" — by backtesting the PURE UPSTREAM
# NostalgiaForInfinityX7 strategy (not the NostalgiaForInfinityX7ML
# subclass — deliberately excluded so this result can't be blamed on
# anything we added) over the requested window.
#
# WHY THIS DOESN'T (CAN'T) USE THE LIVE CONFIG'S PAIRLIST AS-IS:
# freqtrade's own docs are unconditional here — VolumePairList, AgeFilter,
# SpreadFilter, and RangeStabilityFilter "do not support backtesting mode",
# full stop. No flag enables them (--enable-dynamic-pairlist only helps
# handlers that DO support backtesting but need per-candle refresh, e.g.
# ShuffleFilter — it does not unlock these four). This was tried and
# confirmed to hard-error, twice, before landing on the approach below.
#
# APPROACH: freqtrade's own documented workaround for this exact situation
# is to snapshot the dynamic pairlist once (via `freqtrade test-pairlist`,
# which runs the SAME filter chain as the live config) into a plain pair
# list, then backtest against that list using StaticPairList. This is
# openly a simplification, not a perfect reconstruction — see the one
# unavoidable limitation below — but it's the only approach freqtrade
# actually supports, and it fully answers the question this workflow
# exists for.
#
# ONE UNAVOIDABLE LIMITATION (not a bug, inherent to how freqtrade works):
# the snapshotted pairlist reflects TODAY's top-100-by-volume pairs,
# applied across the entire historical test window — not what was
# actually in the top 100 on each individual day of that window. A coin
# that pumped into high volume 3 weeks ago and has since cooled off won't
# be in today's snapshot; a coin that's hot today but was quiet 3 weeks
# ago will be, for the whole window. Official freqtrade docs confirm
# reproducibility "cannot be guaranteed" for anything other than
# StaticPairList for exactly this reason. There is no freqtrade-supported
# way around this — it's a property of backtesting dynamic pairlists.
#
# WARMUP: informative_1d_indicators() needs a 200-period daily EMA, so
# the download window includes a 250-day buffer before the requested
# test window regardless of how long that window is.
#
# TEST WINDOW LENGTH: defaults to 30 days; pass a smaller value (the
# workflow accepts a minimum of 20) via workflow_dispatch input if 30
# days of historical OKX data + backtest runtime proves too slow.

on:
  workflow_dispatch:
    inputs:
      test_window_days:
        description: "How many days back to report entries for (min 20, default 30)"
        required: false
        default: "30"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TA-Lib system library
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget
          wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib
          ./configure --prefix=/usr
          make
          sudo make install
          cd ..

      - name: Install Freqtrade + dependencies
        run: |
          python -m pip install --upgrade pip
          pip install freqtrade
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Prepare backtest user_data (PURE upstream strategy — no ML subclass)
        run: |
          mkdir -p user_data/strategies user_data/logs user_data/data/okx user_data/backtest_results
          # Deliberately NOT copying NostalgiaForInfinityX7ML.py here — this
          # backtest exists specifically to check the result independent of
          # anything in our ML subclass, so it runs the upstream class
          # directly instead of pointing at NostalgiaForInfinityX7ML.
          if [ -e user_data/strategies/NostalgiaForInfinityX7.py ]; then
            echo "Strategy file already present at destination (symlink from repo layout) — skipping copy."
          else
            cp NostalgiaForInfinityX7.py user_data/strategies/
          fi
          # Base config to snapshot the pairlist from, and to derive the
          # backtest config from — byte-for-byte the real live spot config.
          cp config_dryrun_telegram.json user_data/live_config.json

      - name: Compute date range
        id: dates
        run: |
          RAW_DAYS="${{ github.event.inputs.test_window_days }}"
          TEST_DAYS="${RAW_DAYS:-30}"
          if [ "$TEST_DAYS" -lt 20 ]; then
            echo "::warning::Requested $TEST_DAYS days is below the 20-day minimum — using 20."
            TEST_DAYS=20
          fi
          TEST_END=$(date -u +%Y%m%d)
          TEST_START=$(date -u -d "${TEST_DAYS} days ago" +%Y%m%d)
          # 250 days covers the 200-period daily EMA (informative_1d_indicators)
          # with margin to spare, plus everything shorter (4h/1h/15m/5m periods).
          DOWNLOAD_START=$(date -u -d '250 days ago' +%Y%m%d)
          echo "test_days=$TEST_DAYS" >> "$GITHUB_OUTPUT"
          echo "test_start=$TEST_START" >> "$GITHUB_OUTPUT"
          echo "test_end=$TEST_END" >> "$GITHUB_OUTPUT"
          echo "download_start=$DOWNLOAD_START" >> "$GITHUB_OUTPUT"
          echo "Test window (reported results): $TEST_START - $TEST_END ($TEST_DAYS days)"
          echo "Download window (incl. 200-day-EMA warmup buffer): $DOWNLOAD_START - $TEST_END"

      - name: Snapshot today's dynamic pairlist (test-pairlist, same filter chain as live)
        run: |
          freqtrade test-pairlist \
            --config user_data/live_config.json \
            --quote USDT \
            --print-json > user_data/pairlist_snapshot.json
          echo "Snapshotted pairlist:"
          cat user_data/pairlist_snapshot.json

      - name: Build backtest config (live config + StaticPairList from snapshot)
        run: |
          python3 << 'PYEOF'
          import json

          with open("user_data/live_config.json") as f:
              cfg = json.load(f)
          with open("user_data/pairlist_snapshot.json") as f:
              pairs = json.load(f)

          if not isinstance(pairs, list) or not pairs:
              raise SystemExit(f"test-pairlist returned no usable pair list: {pairs!r}")

          # Replace the dynamic filter chain with a plain static list of
          # today's snapshot — the only pairlist handler freqtrade actually
          # supports in backtesting. Everything else in the config (strategy
          # params, exchange, stake sizing, etc.) is left exactly as-is.
          cfg["exchange"]["pair_whitelist"] = pairs
          cfg["pairlists"] = [{"method": "StaticPairList"}]
          # Backtesting ignores telegram/dry_run/db_url, but strip the
          # placeholder telegram block anyway so nothing about it can
          # confuse the run.
          cfg["telegram"] = {"enabled": False, "token": "", "chat_id": ""}

          with open("user_data/config.json", "w") as f:
              json.dump(cfg, f, indent=2)

          print(f"Backtest config built with {len(pairs)} statically-pinned pairs.")
          PYEOF

      - name: Download OKX spot historical data (5m/15m/1h/4h/1d)
        run: |
          freqtrade download-data \
            --config user_data/config.json \
            --exchange okx \
            --timerange "${{ steps.dates.outputs.download_start }}-${{ steps.dates.outputs.test_end }}" \
            --timeframes 5m 15m 1h 4h 1d \
            --erase

      - name: Run backtest (pure upstream strategy, results restricted to test window)
        run: |
          freqtrade backtesting \
            --config user_data/config.json \
            --strategy NostalgiaForInfinityX7 \
            --timerange "${{ steps.dates.outputs.test_start }}-${{ steps.dates.outputs.test_end }}" \
            --timeframe 5m \
            --export trades \
            --export-directory user_data/backtest_results \
            | tee user_data/logs/backtest.log

      - name: Summarize entries by week and by tag
        if: always()
        run: |
          python3 << 'PYEOF'
          import json, glob, zipfile
          from collections import defaultdict
          from datetime import datetime

          # --export-filename is deprecated/ignored, so don't assume a fixed
          # name — freqtrade writes its own auto-named file(s) under
          # --export-directory. Results may be a plain .json or a .zip
          # containing one; handle both rather than guessing.
          candidates = sorted(
              glob.glob("user_data/backtest_results/*.json")
              + glob.glob("user_data/backtest_results/*.zip")
          )
          if not candidates:
              print("No result file found under user_data/backtest_results/ — "
                    "backtest likely failed before producing output, or wrote "
                    "somewhere unexpected. Check the full log below.")
              raise SystemExit(0)

          latest = candidates[-1]
          print(f"Reading backtest result from: {latest}")

          if latest.endswith(".zip"):
              with zipfile.ZipFile(latest) as zf:
                  json_names = [n for n in zf.namelist() if n.endswith(".json")]
                  if not json_names:
                      print(f"No .json file found inside {latest}.")
                      raise SystemExit(0)
                  with zf.open(json_names[0]) as f:
                      data = json.load(f)
          else:
              with open(latest) as f:
                  data = json.load(f)

          # freqtrade export format: {"strategy": {"<name>": {"trades": [...]}}}
          strat_key = next(iter(data.get("strategy", {})), None)
          trades = data.get("strategy", {}).get(strat_key, {}).get("trades", []) if strat_key else []

          print(f"Total entries in test window: {len(trades)}\n")

          by_week = defaultdict(int)
          by_tag = defaultdict(int)
          for t in trades:
              open_date = t.get("open_date", "")[:10]
              try:
                  dt = datetime.strptime(open_date, "%Y-%m-%d")
                  week_label = dt.strftime("Week of %Y-%m-%d")
              except ValueError:
                  week_label = "unknown"
              by_week[week_label] += 1
              by_tag[str(t.get("enter_tag"))] += 1

          with open("user_data/logs/summary.txt", "w") as out:
              out.write(f"Total entries in test window: {len(trades)}\n\n")
              out.write("By week:\n")
              for wk in sorted(by_week):
                  out.write(f"  {wk}: {by_week[wk]}\n")
              out.write("\nBy enter_tag:\n")
              for tag, n in sorted(by_tag.items(), key=lambda x: -x[1]):
                  out.write(f"  tag {tag}: {n}\n")
          PYEOF
          cat user_data/logs/summary.txt 2>/dev/null || echo "No summary produced."

      - name: Post result to Job Summary
        if: always()
        run: |
          {
            echo "## Backtest Signal Frequency — pure upstream strategy, no ML subclass"
            echo ""
            echo "Test window: ${{ steps.dates.outputs.test_start }} - ${{ steps.dates.outputs.test_end }} (${{ steps.dates.outputs.test_days }} days)"
            echo "(downloaded from ${{ steps.dates.outputs.download_start }} for warmup)"
            echo ""
            echo "**Purpose:** this run uses NostalgiaForInfinityX7 directly — the ML subclass"
            echo "(order_filled logging, btc_info_timeframes override) is completely excluded — so"
            echo "a low count here means the frequency is inherent to the strategy/market/pairlist"
            echo "snapshot, not something in our code."
            echo ""
            echo "**Known limitation:** the pairlist is a snapshot of TODAY's top pairs by volume,"
            echo "applied across the whole historical window (freqtrade doesn't support reconstructing"
            echo "the historical pairlist day-by-day in backtesting) — see the workflow file header."
            echo ""
            if [ -f user_data/logs/summary.txt ]; then
              echo '```'
              cat user_data/logs/summary.txt
              echo '```'
            fi
            echo ""
            echo "<details><summary>Full freqtrade backtest report</summary>"
            echo ""
            echo '```'
            cat user_data/logs/backtest.log 2>/dev/null | tail -150
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
