name: Backtest Signal Frequency

run-name: >-
  Backtest ${{ inputs.strategy }} ${{ inputs.market }} ${{ inputs.direction }}
  end=${{ inputs.end_date || 'today' }} ref=${{ inputs.ref || 'main' }}${{ inputs.derisk_hold_short != 'default' && format(' derisk_short={0}', inputs.derisk_hold_short) || '' }}${{ inputs.stale_max_daily_range_pct != '' && format(' stale_range={0}', inputs.stale_max_daily_range_pct) || '' }}${{ inputs.nfi_overrides != '' && ' +overrides' || '' }}

# Manual backtest of the NFI strategies on OKX data.
#
# Reproducible A/B runs:
#   * ref          -> take the strategy files (.py) from this commit/branch/tag,
#                     everything else (configs, this workflow) stays from main.
#   * end_date     -> fix the window end (YYYYMMDD). Same end_date + test_days
#                     = same window on every run.
#   * pairs_run_id -> reuse the pairlist snapshot of an earlier run (run id from
#                     the run URL .../actions/runs/<ID>) so pairs are identical.
#   * direction    -> both | long_only (long_only = subclass with can_short=False).
#
# NFI parameter overrides (no strategy file edits):
#   * derisk_hold_short         -> default | true | false
#                                  (bad_trade_controller_derisk_hold_short_enable)
#   * stale_max_daily_range_pct -> number, empty = strategy default
#                                  (bad_trade_controller_stale_max_daily_range_pct)
#   * nfi_overrides             -> free JSON object, e.g. {"grind_mode_max_slots": 2}
#                                  Keys must be in the strategy's NFI_SAFE_PARAMETERS.
#   All three are written into the "nfi_parameters" block of the backtest config.
#   Values from nfi_overrides win over the two dedicated inputs.
#
# Known limitation: the pairlist is a snapshot of TODAY's top pairs by volume,
# applied to the whole window (freqtrade can't rebuild historical pairlists).

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Strategy'
        type: choice
        options:
          - NostalgiaForInfinityX8
          - NostalgiaForInfinityX7ML
          - NostalgiaForInfinityX7
        default: NostalgiaForInfinityX8
      market:
        description: 'Market'
        type: choice
        options:
          - futures
          - spot
        default: futures
      test_days:
        description: 'Test window length in days (min 20)'
        type: string
        default: '90'
      end_date:
        description: 'Window end YYYYMMDD (empty = today UTC)'
        type: string
        default: ''
      ref:
        description: 'Git ref/commit to take strategy files from (empty = main)'
        type: string
        default: ''
      direction:
        description: 'Trade direction'
        type: choice
        options:
          - both
          - long_only
        default: both
      pairs_run_id:
        description: 'Reuse pairlist snapshot of this earlier run id (empty = new snapshot)'
        type: string
        default: ''
      derisk_hold_short:
        description: 'NFI override: bad_trade_controller_derisk_hold_short_enable'
        type: choice
        options:
          - default
          - 'true'
          - 'false'
        default: default
      stale_max_daily_range_pct:
        description: 'NFI override: bad_trade_controller_stale_max_daily_range_pct (empty = default 7)'
        type: string
        default: ''
      nfi_overrides:
        description: 'NFI override: extra JSON object of safe parameters (empty = none)'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash   # -e -o pipefail: a failing freqtrade stops the job even behind `| tee`

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      STRATEGY_IN: ${{ inputs.strategy }}
      MARKET_IN: ${{ inputs.market }}
      DAYS_IN: ${{ inputs.test_days }}
      END_IN: ${{ inputs.end_date }}
      REF_IN: ${{ inputs.ref }}
      DIRECTION_IN: ${{ inputs.direction }}
      PAIRS_RUN_IN: ${{ inputs.pairs_run_id }}
      DERISK_SHORT_IN: ${{ inputs.derisk_hold_short }}
      STALE_RANGE_IN: ${{ inputs.stale_max_daily_range_pct }}
      OVERRIDES_IN: ${{ inputs.nfi_overrides }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Take strategy files from ref (optional)
        if: ${{ inputs.ref != '' }}
        run: |
          # Resolve short SHAs / branches / tags to a full 40-char SHA first:
          # `git fetch origin <short-sha>` does not work.
          FULL_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${REF_IN}" --jq .sha)
          echo "ref '$REF_IN' resolved to $FULL_SHA"
          git fetch --no-tags --depth=1 origin "$FULL_SHA"
          for f in \
            NostalgiaForInfinityX7.py NostalgiaForInfinityX7ML.py NostalgiaForInfinityX8.py \
            user_data/strategies/NostalgiaForInfinityX7.py \
            user_data/strategies/NostalgiaForInfinityX7ML.py \
            user_data/strategies/NostalgiaForInfinityX8.py; do
            if git cat-file -e "FETCH_HEAD:$f" 2>/dev/null; then
              git checkout FETCH_HEAD -- "$f"
              echo "taken from $REF_IN: $f"
            fi
          done
          echo "strategy_ref=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install TA-Lib system library
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl

          # SourceForge is flaky (wget exit code 8 = server error), so: several
          # URLs, retries, and the tarball is validated before use.
          OK=0
          for URL in \
            "https://downloads.sourceforge.net/project/ta-lib/ta-lib/0.4.0/ta-lib-0.4.0-src.tar.gz" \
            "http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz" \
            "https://sourceforge.net/projects/ta-lib/files/ta-lib/0.4.0/ta-lib-0.4.0-src.tar.gz/download"; do
            echo "Trying $URL"
            rm -f ta-lib-0.4.0-src.tar.gz
            if curl -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 \
                 -o ta-lib-0.4.0-src.tar.gz "$URL" \
               && tar -tzf ta-lib-0.4.0-src.tar.gz > /dev/null 2>&1; then
              OK=1
              break
            fi
          done

          if [ "$OK" = "1" ]; then
            tar -xzf ta-lib-0.4.0-src.tar.gz
            cd ta-lib
            ./configure --prefix=/usr
            make
            sudo make install
            cd ..
          else
            # Not fatal: recent TA-Lib Python wheels bundle the C library, so
            # `pip install` in the next step may still work without it.
            echo "::warning::Could not download the TA-Lib C source; continuing -- relying on the pip wheel."
          fi

      - name: Install Freqtrade + dependencies
        run: |
          python -m pip install --upgrade pip
          pip install freqtrade
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Prepare backtest user_data
        run: |
          mkdir -p user_data/strategies user_data/logs user_data/data/okx user_data/backtest_results
          STRATEGY="${STRATEGY_IN:-NostalgiaForInfinityX8}"

          # X7 base file: needed for X7 itself and for the ML subclass.
          if [ -e user_data/strategies/NostalgiaForInfinityX7.py ]; then
            echo "X7 file already present at destination -- skipping copy."
          else
            cp NostalgiaForInfinityX7.py user_data/strategies/
          fi

          if [ "$STRATEGY" = "NostalgiaForInfinityX7ML" ]; then
            if [ -e user_data/strategies/NostalgiaForInfinityX7ML.py ]; then
              echo "ML file already present at destination -- skipping copy."
            else
              cp NostalgiaForInfinityX7ML.py user_data/strategies/
            fi
          fi

          if [ "$STRATEGY" = "NostalgiaForInfinityX8" ]; then
            if [ -e user_data/strategies/NostalgiaForInfinityX8.py ]; then
              echo "X8 file already present at destination -- skipping copy."
            else
              cp NostalgiaForInfinityX8.py user_data/strategies/
            fi
          fi

          # Base config for the selected market.
          MARKET="${MARKET_IN:-futures}"
          if [ "$MARKET" = "futures" ]; then
            cp config_dryrun_futures.json user_data/live_config.json
          else
            cp config_dryrun_telegram.json user_data/live_config.json
          fi
          echo "market=$MARKET" >> "$GITHUB_ENV"

          # Long-only variant: thin subclass, shorts disabled two ways
          # (can_short=False AND enter_short forced to 0).
          BT_STRATEGY="$STRATEGY"
          if [ "$DIRECTION_IN" = "long_only" ]; then
            BT_STRATEGY="${STRATEGY}LongOnly"
            cat > "user_data/strategies/${BT_STRATEGY}.py" <<EOF
          from ${STRATEGY} import ${STRATEGY}


          class ${BT_STRATEGY}(${STRATEGY}):
              can_short = False

              def populate_entry_trend(self, df, metadata):
                  df = super().populate_entry_trend(df, metadata)
                  if "enter_short" in df.columns:
                      df["enter_short"] = 0
                  return df
          EOF
          fi
          echo "bt_strategy=$BT_STRATEGY" >> "$GITHUB_ENV"
          echo "base_strategy=$STRATEGY" >> "$GITHUB_ENV"

      - name: Strategy diagnostics (version, commit, bad-trade flags)
        run: |
          F="user_data/strategies/${base_strategy}.py"
          {
            echo "repo HEAD:      $(git rev-parse HEAD)"
            echo "strategy ref:   ${strategy_ref:-<same as HEAD>}"
            echo "strategy file:  $F"
            echo "file sha256:    $(sha256sum "$F" | cut -d' ' -f1)"
            echo "version():"
            grep -n -A2 "def version" "$F" | head -5 || true
            echo "bad_trade_controller mentions: $(grep -c 'bad_trade_controller' "$F" || true)"
            echo "structure_break mentions:      $(grep -c 'structure_break' "$F" || true)"
            echo "derisk mentions:               $(grep -c -i 'derisk' "$F" || true)"
            echo "--- bad_trade / derisk flag lines IN THE FILE (defaults, before overrides; first 25) ---"
            grep -n -i -E "(bad_trade|derisk|structure_break).*(enable|enabled|= *(True|False))" "$F" | head -25 || true
          } | tee user_data/logs/diagnostics.txt

      - name: Compute date range
        id: dates
        run: |
          TEST_DAYS="${DAYS_IN:-90}"
          if ! [[ "$TEST_DAYS" =~ ^[0-9]+$ ]]; then echo "::error::test_days must be a number"; exit 1; fi
          if [ "$TEST_DAYS" -lt 20 ]; then
            echo "::warning::Requested $TEST_DAYS days is below the 20-day minimum -- using 20."
            TEST_DAYS=20
          fi
          if [ -n "$END_IN" ]; then
            if ! [[ "$END_IN" =~ ^[0-9]{8}$ ]]; then echo "::error::end_date must be YYYYMMDD"; exit 1; fi
            TEST_END="$END_IN"
          else
            TEST_END=$(date -u +%Y%m%d)
          fi
          TEST_START=$(date -u -d "${TEST_END} - ${TEST_DAYS} days" +%Y%m%d)
          # Long indicators (EMA200 on 1h/4h/1d) need 400 days of history;
          # 5m/15m only need window + 60 days.
          DOWNLOAD_START=$(date -u -d "${TEST_END} - 400 days" +%Y%m%d)
          SHORT_DOWNLOAD_START=$(date -u -d "${TEST_END} - $((TEST_DAYS + 60)) days" +%Y%m%d)
          {
            echo "test_days=$TEST_DAYS"
            echo "test_start=$TEST_START"
            echo "test_end=$TEST_END"
            echo "download_start=$DOWNLOAD_START"
            echo "short_download_start=$SHORT_DOWNLOAD_START"
          } >> "$GITHUB_OUTPUT"
          echo "Test window: $TEST_START - $TEST_END ($TEST_DAYS days)"
          echo "Download window: $DOWNLOAD_START - $TEST_END (5m/15m from $SHORT_DOWNLOAD_START)"

      - name: Pairlist snapshot (new, or reused from an earlier run)
        run: |
          if [ -n "$PAIRS_RUN_IN" ]; then
            echo "Reusing pairlist snapshot from run $PAIRS_RUN_IN"
            gh run download "$PAIRS_RUN_IN" --name "pairlist-$PAIRS_RUN_IN" --dir user_data/_pl
            cp user_data/_pl/pairlist_snapshot.json user_data/pairlist_snapshot.json
          else
            # test-pairlist does NOT accept --trading-mode/--margin-mode;
            # they already come from live_config.json.
            freqtrade test-pairlist \
              --config user_data/live_config.json \
              --quote USDT \
              --print-json > user_data/pairlist_snapshot.json
          fi
          echo "Pairlist snapshot:"
          cat user_data/pairlist_snapshot.json

      - name: Build backtest config (live config + StaticPairList + NFI overrides)
        run: |
          python3 << 'PYEOF'
          import json, os, re

          with open("user_data/live_config.json") as f:
              cfg = json.load(f)
          with open("user_data/pairlist_snapshot.json") as f:
              pairs = json.load(f)

          if not isinstance(pairs, list) or not pairs:
              raise SystemExit(f"pairlist snapshot has no usable pair list: {pairs!r}")

          # Backtesting only supports StaticPairList.
          cfg["exchange"]["pair_whitelist"] = pairs
          cfg["pairlists"] = [{"method": "StaticPairList"}]
          cfg["telegram"] = {"enabled": False, "token": "", "chat_id": ""}

          # ---- NFI parameter overrides (nfi_parameters block) ----
          requested = {}

          derisk = os.environ.get("DERISK_SHORT_IN", "default").strip().lower()
          if derisk in ("true", "false"):
              requested["bad_trade_controller_derisk_hold_short_enable"] = (derisk == "true")

          stale = os.environ.get("STALE_RANGE_IN", "").strip()
          if stale:
              try:
                  requested["bad_trade_controller_stale_max_daily_range_pct"] = float(stale)
              except ValueError:
                  raise SystemExit(f"stale_max_daily_range_pct must be a number, got {stale!r}")

          raw = os.environ.get("OVERRIDES_IN", "").strip()
          if raw:
              try:
                  extra = json.loads(raw)
              except json.JSONDecodeError as e:
                  raise SystemExit(f"nfi_overrides is not valid JSON: {e}")
              if not isinstance(extra, dict):
                  raise SystemExit("nfi_overrides must be a JSON object, e.g. {\"grind_mode_max_slots\": 2}")
              requested.update(extra)   # wins over the dedicated inputs

          if requested:
              # Validate keys against the strategy's own NFI_SAFE_PARAMETERS list.
              base = os.environ.get("base_strategy", "NostalgiaForInfinityX8")
              family_file = ("NostalgiaForInfinityX8.py" if base == "NostalgiaForInfinityX8"
                             else "NostalgiaForInfinityX7.py")
              src_path = os.path.join("user_data", "strategies", family_file)
              safe = set()
              try:
                  with open(src_path, encoding="utf-8") as f:
                      src = f.read()
                  m = re.search(r"NFI_SAFE_PARAMETERS\s*=\s*\[(.*?)\n\s*\]", src, re.S)
                  if m:
                      safe = set(re.findall(r"[\"']([A-Za-z0-9_]+)[\"']", m.group(1)))
              except OSError:
                  pass
              if safe:
                  bad = sorted(k for k in requested if k not in safe)
                  if bad:
                      raise SystemExit(
                          "These keys are not in NFI_SAFE_PARAMETERS of "
                          f"{family_file} and would be ignored: {bad}"
                      )
              else:
                  print("::warning::Could not parse NFI_SAFE_PARAMETERS; key validation skipped "
                        "(the post-backtest check will still report ignored keys).")

              params = dict(cfg.get("nfi_parameters") or {})
              params.update(requested)
              cfg["nfi_parameters"] = params

          with open("user_data/logs/overrides_requested.json", "w") as f:
              json.dump(requested, f, indent=2)
          print("NFI overrides requested:", json.dumps(requested) if requested else "(none)")

          with open("user_data/config.json", "w") as f:
              json.dump(cfg, f, indent=2)

          print(f"Backtest config built with {len(pairs)} statically-pinned pairs.")
          PYEOF

      - name: Restore OKX data cache
        id: datacache
        uses: actions/cache@v4
        with:
          path: user_data/data
          key: okx-data-${{ env.market }}-${{ steps.dates.outputs.test_end }}-${{ steps.dates.outputs.test_days }}-${{ hashFiles('user_data/pairlist_snapshot.json') }}

      - name: Download OKX historical data
        if: steps.datacache.outputs.cache-hit != 'true'
        run: |
          # trading_mode comes from user_data/config.json. In futures mode each
          # call also fetches mark + funding_rate candles.
          # Call 1 (runs first): long window for 1h/4h/1d, with --erase.
          freqtrade download-data \
            --config user_data/config.json \
            --exchange okx \
            --timerange "${{ steps.dates.outputs.download_start }}-${{ steps.dates.outputs.test_end }}" \
            --timeframes 1h 4h 1d \
            --erase
          # Call 2: heavy 5m/15m only for window + 60 days. No --erase on purpose
          # (it would wipe the mark/funding data call 1 just fetched).
          freqtrade download-data \
            --config user_data/config.json \
            --exchange okx \
            --timerange "${{ steps.dates.outputs.short_download_start }}-${{ steps.dates.outputs.test_end }}" \
            --timeframes 5m 15m

      - name: Run backtest (results restricted to test window)
        run: |
          echo "Backtesting strategy: $bt_strategy on market: $market (direction: $DIRECTION_IN)"
          # stdout (the report) -> backtest.log ; stderr (freqtrade/strategy log lines,
          # incl. "Parameter X changed from ...") -> backtest_stderr.log + console.
          freqtrade backtesting \
            --config user_data/config.json \
            --strategy "$bt_strategy" \
            --strategy-path user_data/strategies \
            --timerange "${{ steps.dates.outputs.test_start }}-${{ steps.dates.outputs.test_end }}" \
            --timeframe 5m \
            --export trades \
            --export-directory user_data/backtest_results \
            2> >(tee user_data/logs/backtest_stderr.log >&2) \
            | tee user_data/logs/backtest.log

      - name: Verify NFI overrides were applied
        if: always()
        continue-on-error: true
        run: |
          python3 << 'PYEOF'
          import json, os

          req_path = "user_data/logs/overrides_requested.json"
          out_path = "user_data/logs/overrides_applied.txt"
          if not os.path.exists(req_path):
              raise SystemExit(0)
          with open(req_path) as f:
              requested = json.load(f)
          if not requested:
              with open(out_path, "w") as f:
                  f.write("No NFI overrides requested (strategy defaults).\n")
              raise SystemExit(0)

          log = ""
          for p in ("user_data/logs/backtest_stderr.log", "user_data/logs/backtest.log"):
              if os.path.exists(p):
                  with open(p, errors="replace") as f:
                      log += f.read() + "\n"

          lines = []
          for k, v in requested.items():
              applied = [l.strip() for l in log.splitlines() if f"Parameter {k} changed from" in l]
              invalid = [l.strip() for l in log.splitlines() if f"Invalid or unsafe parameter: {k}" in l]
              if applied:
                  lines.append(f"OK       {applied[-1]}")
              elif invalid:
                  lines.append(f"IGNORED  {k} = {v!r}  -> {invalid[-1]}")
                  print(f"::error::Override {k} was IGNORED by the strategy")
              else:
                  lines.append(f"UNKNOWN  {k} = {v!r}  (no 'changed from' line found in the log)")
                  print(f"::warning::Could not confirm override {k} in the log")
          text = "\n".join(lines) + "\n"
          with open(out_path, "w") as f:
              f.write(text)
          print(text)
          PYEOF

      - name: Summarize trades (weeks, tags, exits, long/short, worst trades)
        run: |
          python3 << 'PYEOF'
          import json, glob, zipfile
          from collections import defaultdict
          from datetime import datetime

          candidates = sorted(
              glob.glob("user_data/backtest_results/*.json")
              + glob.glob("user_data/backtest_results/*.zip")
          )
          candidates = [c for c in candidates if "meta" not in c and "config" not in c]
          if not candidates:
              print("No result file found under user_data/backtest_results/.")
              raise SystemExit(0)

          latest = candidates[-1]
          print(f"Reading backtest result from: {latest}")
          if latest.endswith(".zip"):
              with zipfile.ZipFile(latest) as zf:
                  names = [n for n in zf.namelist()
                           if n.endswith(".json") and "_config" not in n and "_meta" not in n]
                  if not names:
                      print(f"No result .json inside {latest}.")
                      raise SystemExit(0)
                  with zf.open(names[0]) as f:
                      data = json.load(f)
          else:
              with open(latest) as f:
                  data = json.load(f)

          strat_key = next(iter(data.get("strategy", {})), None)
          trades = data.get("strategy", {}).get(strat_key, {}).get("trades", []) if strat_key else []

          out = []
          w = out.append
          w(f"Strategy: {strat_key}")
          w(f"Total entries in test window: {len(trades)}")
          tot = sum(t.get("profit_abs", 0) for t in trades)
          w(f"Total profit: {tot:.3f} USDT")

          longs = [t for t in trades if not t.get("is_short")]
          shorts = [t for t in trades if t.get("is_short")]
          w(f"Long / Short trades: {len(longs)} / {len(shorts)}")
          w(f"Long / Short profit USDT: {sum(t['profit_abs'] for t in longs):.3f} / "
            f"{sum(t['profit_abs'] for t in shorts):.3f}")

          losers = [t for t in trades if t.get("profit_abs", 0) < 0]
          w(f"Losing trades: {len(losers)}  (sum {sum(t['profit_abs'] for t in losers):.3f} USDT)")

          w("\nBy exit_reason (only non-profit exits, i.e. force_exit/stop_loss/bad_trade/...):")
          by_exit = defaultdict(lambda: [0, 0.0])
          for t in trades:
              r = t.get("exit_reason", "?")
              by_exit[r][0] += 1
              by_exit[r][1] += t.get("profit_abs", 0)
          for r, (n, p) in sorted(by_exit.items(), key=lambda x: x[1][1]):
              if p < 0 or r in ("force_exit", "stop_loss") or "bad_trade" in r or "derisk" in r \
                      or "structure" in r or "abandon" in r:
                  w(f"  {r:50s} n={n:3d}  profit={p:10.3f}")

          w("\nBy enter_tag (count, profit USDT, losses) -- worst 15:")
          by_tag = defaultdict(lambda: [0, 0.0, 0])
          for t in trades:
              k = str(t.get("enter_tag"))
              by_tag[k][0] += 1
              by_tag[k][1] += t.get("profit_abs", 0)
              if t.get("profit_abs", 0) < 0:
                  by_tag[k][2] += 1
          for k, (n, p, l) in sorted(by_tag.items(), key=lambda x: x[1][1])[:15]:
              w(f"  tag {k:14s} n={n:3d}  profit={p:10.3f}  losses={l}")

          w("\nWorst 10 trades:")
          for t in sorted(trades, key=lambda t: t.get("profit_abs", 0))[:10]:
              dur = t.get("trade_duration", 0)
              w(f"  {t.get('pair','?'):18s} tag={str(t.get('enter_tag')):10s} "
                f"open={str(t.get('open_date',''))[:16]} dur={dur/60:7.1f}h "
                f"{t.get('profit_ratio',0)*100:7.2f}%  {t.get('profit_abs',0):9.3f} USDT  "
                f"exit={t.get('exit_reason')}")

          w("\nBy week (entries):")
          by_week = defaultdict(int)
          for t in trades:
              try:
                  d = datetime.strptime(t.get("open_date", "")[:10], "%Y-%m-%d")
                  by_week[d.strftime("Week of %Y-%m-%d")] += 1
              except ValueError:
                  by_week["unknown"] += 1
          for wk in sorted(by_week):
              w(f"  {wk}: {by_week[wk]}")

          with open("user_data/logs/summary.txt", "w") as f:
              f.write("\n".join(out) + "\n")
          PYEOF
          cat user_data/logs/summary.txt 2>/dev/null || echo "No summary produced."

      - name: Post result to Job Summary
        if: always()
        continue-on-error: true
        run: |
          {
            echo "## Backtest Signal Frequency"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Market | \`$market\` |"
            echo "| Strategy | \`$bt_strategy\` (direction: \`$DIRECTION_IN\`) |"
            echo "| Strategy ref | \`${strategy_ref:-main (HEAD $(git rev-parse --short HEAD 2>/dev/null || echo n/a))}\` |"
            echo "| Test window | ${{ steps.dates.outputs.test_start }} - ${{ steps.dates.outputs.test_end }} (${{ steps.dates.outputs.test_days }} days) |"
            echo "| Pairlist | $( [ -n "$PAIRS_RUN_IN" ] && echo "reused from run $PAIRS_RUN_IN" || echo "new snapshot -- reuse with pairs_run_id=${{ github.run_id }}" ) |"
            echo "| Data cache | ${{ steps.datacache.outputs.cache-hit == 'true' && 'hit' || 'miss (downloaded)' }} |"
            echo ""
            echo "**Known limitation:** the pairlist is a snapshot of TODAY's top pairs by volume,"
            echo "applied to the whole historical window."
            echo ""
            if [ -f user_data/logs/overrides_requested.json ]; then
              echo "### NFI parameter overrides"
              echo "Requested:"
              echo '```json'
              cat user_data/logs/overrides_requested.json
              echo ""
              echo '```'
              if [ -f user_data/logs/overrides_applied.txt ]; then
                echo "Applied (from freqtrade log):"
                echo '```'
                cat user_data/logs/overrides_applied.txt
                echo '```'
              fi
            fi
            if [ -f user_data/logs/diagnostics.txt ]; then
              echo "### Strategy diagnostics"
              echo '```'
              cat user_data/logs/diagnostics.txt
              echo '```'
            fi
            if [ -f user_data/logs/summary.txt ]; then
              echo "### Trade summary"
              echo '```'
              cat user_data/logs/summary.txt
              echo '```'
            fi
            echo "<details><summary>Full freqtrade backtest report</summary>"
            echo ""
            echo '```'
            tail -150 user_data/logs/backtest.log 2>/dev/null || echo "(no backtest.log -- an earlier step failed)"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pairlist snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pairlist-${{ github.run_id }}
          path: user_data/pairlist_snapshot.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload backtest results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ github.run_id }}
          path: |
            user_data/backtest_results
            user_data/logs
          if-no-files-found: ignore
          retention-days: 30
